<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">

<title>Sensor Technology · Market monitor</title>
<!-- versão 2026.11.10-2114 -->
<style>
@font-face { font-family: 'Martian Mono'; font-style: normal; font-display: swap; font-weight: 100 800; font-stretch: 75% 112.5%; src: url(fonts/MartianMono-var.woff2) format('woff2'); }
@font-face { font-family: 'Noto Sans JP'; font-weight: 700; font-display: swap; src: url(fonts/NotoSansJP-bold.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
@font-face { font-family: 'Noto Sans JP'; font-weight: 450; font-display: swap; src: url(fonts/NotoSansJP-text.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
/* ============================================================
   Sensor Technology · páginas de operações (planejamento, parceiros)
   Mesmos tokens do app; tudo em rem — a raiz acompanha o tamanho da tela (do celular ao painel 4K).
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #05070B; --bg-2: #0B1017; --surface: #10161F; --surface-2: #151D28;
  --line: rgba(191, 211, 230, .14); --line-2: rgba(191, 211, 230, .28);
  --text: #EFECE6; --text-2: #B3BDCA; --text-3: #8792A8;
  --plat: #BFD3E6; --plat-2: #E8F1FB; --glow: #FFD27A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --r1: #cde2fb; --r2: #86b6ef; --r3: #3987e5; --r4: #256abf; --r5: #184f95;
  --font: 'Archivo', 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html { font-size: clamp(13px, min(1.11vw, 1.98vh), 46px); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
html[lang="ja"] body { line-break: strict; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plat); outline-offset: 3px; border-radius: 4px; }
p, h1, h2, h3, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }

/* ---------- gráficos ---------- */
.viz { position: relative; min-height: 0; }
.viz svg { display: block; width: 100%; height: 100%; overflow: visible; font-family: inherit; }
.viz svg [tabindex]:focus { outline: none; }
.viz svg [tabindex]:focus-visible { stroke: var(--plat); stroke-width: 1.5; }
.viz-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
.viz-tip { position: fixed; z-index: 90; pointer-events: none; max-width: 22rem; padding: .55rem .75rem; border-radius: .5rem; background: #1B2532; border: 1px solid var(--line-2); box-shadow: 0 .6rem 1.8rem rgba(0, 0, 0, .5); font-size: .78rem; line-height: 1.35; color: var(--text-2); }
.viz-tip[hidden] { display: none; }
.viz-tip-t { color: var(--text-2); margin-bottom: .25rem; }
.viz-tip-r { display: flex; align-items: baseline; gap: .45rem; white-space: nowrap; }
.viz-tip-r b { color: var(--text); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
.viz-key { flex: none; width: .9rem; height: 2px; border-radius: 2px; align-self: center; }

.segbar-bar { display: flex; gap: 2px; height: 1.75rem; max-height: 28px; min-height: 22px; border-radius: 6px; }
.segbar-seg { min-width: 2px; border-radius: 4px; display: flex; align-items: center; padding: 0 .5rem; overflow: visible; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.segbar-seg span[hidden] { display: none; }
.segbar-legend { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; margin-top: .7rem; font-size: .8rem; color: var(--text-2); }
.segbar-legend > span { display: inline-flex; align-items: center; gap: .5rem; }
.segbar-legend i { width: .75rem; height: .75rem; border-radius: 2px; flex: none; }

.meters { display: grid; gap: .55rem; }
.meter-row { display: grid; grid-template-columns: minmax(8rem, 38%) 1fr auto; align-items: center; gap: .9rem; font-size: .85rem; color: var(--text-2); }
.meter-track { height: .5rem; border-radius: 99px; background: rgba(57, 135, 229, .22); overflow: hidden; }
.meter-track i { display: block; height: 100%; border-radius: 99px; background: var(--s1); transform-origin: left center; }
.meter-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; }

/* ---------- peças comuns ---------- */
.stat { display: grid; gap: .1rem; }
.stat b { font-size: 2rem; line-height: 1.05; font-weight: 600; font-stretch: 105%; letter-spacing: -.01em; color: var(--text); }
.stat span { font-size: .85rem; color: var(--text-2); max-width: 17rem; }
.note { font-size: .78rem; color: var(--text-3); }
.btn { display: inline-flex; align-items: center; gap: .6rem; min-height: 2.9rem; padding: .7rem 1.35rem; border-radius: 999px; border: 1px solid var(--line-2); font-weight: 500; color: var(--text); text-decoration: none; transition: background .2s, border-color .2s; }
.btn:hover { background: rgba(191, 211, 230, .08); }
.btn:active { background: rgba(191, 211, 230, .16); }
.btn.primary { background: var(--plat); border-color: var(--plat); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: var(--plat-2); }
.btn svg { width: 1.15rem; height: 1.15rem; flex: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ============================================================
   Sensor Technology · Monitor de mercados (câmbio e metais preciosos)
   Linguagem de terminal: fundo preto, âmbar para rótulos, branco para preços, verde/vermelho + seta para variação.
   ============================================================ */
:root {
  --k: #000; --k2: #0A0B0D; --k3: #14161A; --rule: #2A2D33;
  --amber: #FFA028; --amber-2: #B36F16; --white: #F4F1EA; --dim: #8A8F98;
  --up: #2FD479; --down: #FF5A52; --sel: #1E3A5F; --cyan: #7FC8FF;
  --mono: 'Martian Mono', ui-monospace, 'Cascadia Mono', 'Roboto Mono', Consolas, 'Noto Sans JP', monospace;
}
html { font-size: clamp(11px, min(.94vw, 1.68vh), 40px); }
body { background: var(--k); color: var(--amber); font-family: var(--mono); font-stretch: 87.5%; font-size: 1rem; line-height: 1.3; overflow: hidden; font-variant-numeric: tabular-nums; }
.mon { position: fixed; inset: 0; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; }

/* barra superior */
.bar { display: flex; align-items: center; gap: 1.1rem; padding: .55rem 1rem; background: var(--k2); border-bottom: 1px solid var(--rule); min-height: 3.1rem; }
.bar img { height: 1.9rem; width: auto; display: block; }
.bar .ttl { color: var(--k); background: var(--amber); font-weight: 700; padding: .2rem .7rem; letter-spacing: .04em; white-space: nowrap; }
.bar .sub { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bar .sp { flex: 1; }
.clocks { display: flex; gap: 1.3rem; white-space: nowrap; }
.clocks span { color: var(--dim); }
.clocks b { color: var(--white); font-weight: 500; margin-left: .45rem; }
.live { display: inline-flex; align-items: center; gap: .5rem; color: var(--up); font-weight: 600; white-space: nowrap; }
.live i { width: .6rem; height: .6rem; border-radius: 50%; background: currentColor; box-shadow: 0 0 .6rem currentColor; animation: pulse 2s ease-in-out infinite; }
.live.stale { color: var(--amber); } .live.off { color: var(--down); } .live.stale i, .live.off i { animation: none; box-shadow: none; }
@keyframes pulse { 50% { opacity: .35; } }
.bar .langs { display: flex; gap: .15rem; }
.bar .langs button { padding: .25rem .5rem; color: var(--dim); border: 1px solid transparent; min-height: 2rem; font-size: .85rem; white-space: nowrap; }
.bar .langs { flex: none; }
.bar .live, .bar .x, .bar .ttl, .bar img { flex: none; }
.bar .langs button.on { color: var(--k); background: var(--white); }
.bar .x { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .8rem; border: 1px solid var(--rule); color: var(--white); min-height: 2rem; text-decoration: none; font-size: .9rem; white-space: nowrap; }
.bar .x svg { width: .95rem; height: .95rem; }

/* fita */
.tape { overflow: hidden; border-bottom: 1px solid var(--rule); background: var(--k); white-space: nowrap; height: 2.3rem; display: flex; align-items: center; }
.tape-run { display: inline-flex; gap: 2.6rem; padding-left: 2.6rem; animation: tape 60s linear infinite; will-change: transform; }
.tape:hover .tape-run { animation-play-state: paused; }
@keyframes tape { to { transform: translateX(-50%); } }
.tape-i { display: inline-flex; gap: .7rem; align-items: baseline; }
.tape-i b { color: var(--white); font-weight: 600; }

/* grade principal */
.grid { display: grid; grid-template-columns: minmax(0, 34fr) minmax(0, 66fr); grid-template-rows: minmax(0, 1fr); gap: 1px; background: var(--rule); min-height: 0; }
.col { display: grid; gap: 1px; background: var(--rule); min-height: 0; }
.col.l { grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); }
.col.r { grid-template-rows: minmax(0, 1.55fr) minmax(0, 1fr); }
.row2 { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr); gap: 1px; background: var(--rule); min-height: 0; }
.pane { background: var(--k); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; min-width: 0; }
.pane > h2 { margin: 0; display: flex; align-items: center; gap: .7rem; padding: .32rem .8rem; background: var(--k3); font-size: .9rem; font-weight: 600; color: var(--amber); letter-spacing: .03em; border-bottom: 1px solid var(--rule); white-space: nowrap; }
.pane > h2 small { font-size: .82rem; font-weight: 400; color: var(--dim); margin-left: auto; overflow: hidden; text-overflow: ellipsis; }
.pane > h2 kbd { font: inherit; color: var(--k); background: var(--amber); padding: 0 .4rem; font-weight: 700; }

/* linhas grandes (6 instrumentos principais) */
.big { display: grid; grid-auto-rows: minmax(0, 1fr); }
.q { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; grid-template-rows: auto auto; column-gap: 1.3rem; row-gap: .4rem; align-content: center; padding: .5rem 1rem; border-bottom: 1px solid var(--rule); cursor: pointer; text-align: left; width: 100%; position: relative; }
.q:last-child { border-bottom: 0; }
.q.sel { background: linear-gradient(90deg, var(--sel), transparent 85%); }
.q.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--cyan); }
.q .nm { grid-column: 1; grid-row: 1; align-self: center; font-size: 1.4rem; font-weight: 700; color: var(--amber); display: flex; align-items: baseline; gap: .7rem; white-space: nowrap; min-width: 0; }
.q .nm kbd { font: inherit; font-size: .8rem; font-weight: 600; color: var(--dim); border: 1px solid var(--rule); padding: 0 .35rem; }
.q .px { grid-column: 2; grid-row: 1; align-self: center; font-size: 2.7rem; line-height: 1.05; font-weight: 600; font-stretch: 80%; color: var(--white); letter-spacing: -.01em; text-align: right; padding: 0 .3rem; border-radius: 2px; transition: background 1.2s ease-out; }
.q .px.fu { background: rgba(47, 212, 121, .32); transition: none; } .q .px.fd { background: rgba(255, 90, 82, .34); transition: none; }
.q .ch { grid-column: 3; grid-row: 1; align-self: center; display: grid; gap: .1rem; justify-items: end; min-width: 8.4rem; }
.q .ch b { font-size: 1.3rem; font-weight: 600; white-space: nowrap; }
.q .ch small { font-size: .78rem; color: var(--dim); white-space: nowrap; }
.q .meta { grid-column: 1 / -1; grid-row: 2; font-size: .86rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q .meta b { color: var(--white); font-weight: 400; margin-right: .9rem; }
.up { color: var(--up); } .dn { color: var(--down); } .fl { color: var(--dim); }
.q .meta { font-size: .82rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q .meta b { color: var(--white); font-weight: 400; }

/* gráfico */
.chart { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; }
.chart-head { display: flex; align-items: baseline; gap: 1.2rem; padding: .7rem 1rem .2rem; flex-wrap: wrap; }
.chart-head .nm { font-size: 1.5rem; font-weight: 700; color: var(--amber); }
.chart-head .px { font-size: 1.5rem; font-weight: 600; color: var(--white); }
.chart-head .unit { color: var(--dim); font-size: .9rem; }
.chart-head .sp { flex: 1; }
.ranges { display: flex; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
.ranges button { padding: .3rem .8rem; background: var(--k); color: var(--dim); min-height: 2rem; min-width: 3rem; font-size: .9rem; }
.ranges button.on { background: var(--amber); color: var(--k); font-weight: 700; }
.chart .viz { min-height: 0; height: 100%; padding: 0 .4rem; }
.chart .viz svg text { font-family: var(--mono); font-stretch: 80%; }
.chart-note { padding: .25rem 1rem .5rem; color: var(--dim); font-size: .8rem; min-height: 1.6rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* tabelas */
.tb { width: 100%; border-collapse: collapse; align-self: start; }
.tb th { font-weight: 400; color: var(--dim); font-size: .8rem; text-align: right; padding: .35rem .8rem .25rem; white-space: nowrap; }
.tb th:first-child, .tb td:first-child { text-align: left; }
.tb td { padding: .42rem .8rem; text-align: right; color: var(--white); border-top: 1px solid #16181C; white-space: nowrap; font-size: 1.08rem; }
.tb td:first-child { color: var(--amber); font-weight: 600; }
.tb td small { color: var(--dim); font-size: .8rem; }
.scroll { overflow: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }

/* rodapé */
.foot { padding: .4rem 1rem; border-top: 1px solid var(--rule); background: var(--k2); color: var(--dim); font-size: .78rem; line-height: 1.45; }
.foot span { margin-right: 1.6rem; white-space: nowrap; display: inline-block; }

.viz-tip { background: #000; border: 1px solid var(--amber-2); border-radius: 0; font-family: var(--mono); color: var(--dim); box-shadow: none; }
.viz-tip-r b { color: var(--white); }

/* ---------- celular / janela estreita: empilha ---------- */
@media (max-width: 1179px), (orientation: portrait) {
  html { font-size: clamp(14px, 1.9vw, 19px); }
  body { overflow: auto; }
  .mon { position: static; display: block; }
  .bar { flex-wrap: wrap; gap: .5rem .8rem; }
  .bar .sub, .clocks { display: none; }
  .grid, .col, .row2 { display: block; background: none; }
  .pane { border-bottom: 1px solid var(--rule); }
  .q { padding: .8rem .9rem; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; }
  .q .nm { grid-column: 1 / -1; grid-row: 1; font-size: 1.15rem; }
  .q .px { grid-column: 1; grid-row: 2; font-size: 2.2rem; text-align: left; padding: 0; }
  .q .ch { grid-column: 2; grid-row: 2; min-width: 0; }
  .q .meta { grid-row: 3; white-space: normal; line-height: 1.5; }
  .tb td, .tb th { padding-left: .5rem; padding-right: .5rem; }
  .chart .viz { height: clamp(16rem, 42vh, 26rem); }
  .big { grid-auto-rows: auto; }
  .scroll { overflow: visible; }
  .foot span { display: block; white-space: normal; margin: 0 0 .25rem; }
}
@media (prefers-reduced-motion: reduce) { .tape-run { animation: none; } }

</style>
</head>
<body>
<div id="mon" class="mon"></div>
<script>
/* ============================================================
   Sensor Technology · gráficos (SVG puro, sem bibliotecas)
   Regras: marcas finas, eixo único, grade em fio contínuo, texto sempre nas cores de texto,
   dica (tooltip) em todos os gráficos, tabela equivalente para leitores de tela.
   ============================================================ */
const Viz = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const C = {
    s1: '#3987e5', s2: '#d95926', s3: '#199e70', s4: '#c98500',
    ramp: ['#cde2fb', '#86b6ef', '#3987e5', '#256abf', '#184f95'],
    mute: '#3a4658', grid: 'rgba(191,211,230,.13)', axis: 'rgba(191,211,230,.30)',
    text: '#EFECE6', text2: '#B3BDCA', text3: '#8792A8', surface: '#05070B', glow: '#FFD27A',
    good: '#0ca30c', warn: '#fab219', bad: '#d03b3b',
  };
  let LOCALE = 'en-US';
  const setLocale = (l) => { LOCALE = l; };
  const nf = (d) => new Intl.NumberFormat(LOCALE, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  const fmt = (v, d) => nf(d).format(v);
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(name, attrs, parent, text) {
    const n = document.createElementNS(NS, name);
    if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, cls, parent, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- dica (uma só para a página) ---------- */
  let tip;
  function tipEl() {
    if (!tip) { tip = h('div', 'viz-tip', document.body); tip.setAttribute('role', 'status'); tip.hidden = true; }
    return tip;
  }
  // rows: [[rótulo, valor, cor?]]; title opcional. Tudo via textContent.
  function showTip(x, y, title, rows) {
    const t = tipEl(); t.textContent = '';
    if (title) h('div', 'viz-tip-t', t, title);
    (rows || []).forEach(([label, value, color]) => {
      const r = h('div', 'viz-tip-r', t);
      if (color) { const k = h('i', 'viz-key', r); k.style.background = color; }
      h('b', '', r, value); h('span', '', r, label);
    });
    t.hidden = false;
    const z = (parseFloat(document.documentElement.style.zoom) || 1);
    const vw = window.innerWidth / z, vh = window.innerHeight / z;
    const w = t.offsetWidth, hh = t.offsetHeight, pad = 12;
    let left = x / z + 14, top = y / z - hh - 12;
    if (left + w + pad > vw) left = x / z - w - 14;
    if (left < pad) left = pad;
    if (top < pad) top = y / z + 18;
    if (top + hh + pad > vh) top = vh - hh - pad;
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }
  // liga a dica a um elemento (mouse, toque e foco)
  function bindTip(node, title, rows) {
    const on = (e) => { const p = e.touches ? e.touches[0] : e; let x = p.clientX, y = p.clientY; if (x == null) { const b = node.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; } showTip(x, y, typeof title === 'function' ? title() : title, typeof rows === 'function' ? rows() : rows); };
    node.addEventListener('pointerenter', on); node.addEventListener('pointermove', on);
    node.addEventListener('pointerleave', hideTip); node.addEventListener('focus', on); node.addEventListener('blur', hideTip);
    node.addEventListener('pointerdown', on);
  }
  document.addEventListener('scroll', hideTip, true);

  /* ---------- tabela equivalente (leitor de tela) ---------- */
  function table(host, caption, head, rows) {
    const t = h('table', '', h('div', 'viz-sr', host)); // a tabela vai dentro de um bloco recortado (tabela não respeita width/overflow)
    h('caption', '', t, caption || '');
    const tr = h('tr', '', h('thead', '', t)); head.forEach((x) => h('th', '', tr, x));
    const tb = h('tbody', '', t);
    rows.forEach((r) => { const rr = h('tr', '', tb); r.forEach((x) => h('td', '', rr, String(x))); });
  }

  /* ---------- base: mede o contêiner, cria o SVG e redesenha no resize ---------- */
  function mount(host, draw) {
    host.classList.add('viz');
    let raf = 0, last = '';
    const render = (animate) => {
      const w = host.clientWidth, hgt = host.clientHeight;
      if (w < 40 || hgt < 40) return;
      const key = w + 'x' + hgt + '@' + rem() + LOCALE;
      if (!animate && key === last) return;
      last = key;
      host.textContent = '';
      const svg = el('svg', { viewBox: `0 0 ${w} ${hgt}`, width: w, height: hgt, role: 'img' }, host);
      draw({ svg, w, h: hgt, r: rem(), animate: !!animate && !reduced(), host });
    };
    if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(false)); }).observe(host);
    host._render = render;
    render(false);
    return { render, replay: () => render(true) };
  }
  const ticks = (max, n) => {
    const raw = max / (n || 4), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; const out = [];
    for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));

  /* ---------- série mensal longa: área (mensal) + linha (média móvel de 12 meses), um eixo (índice) ----------

  async function pullFx() {
