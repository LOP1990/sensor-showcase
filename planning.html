<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sensor Technology · Planning and control</title>
<!-- versão 2026.11.10-2253 · os slides reservados a parceiros estão cifrados (AES-256-GCM) no bloco "vault"; sem o código de acesso não podem ser lidos -->
<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%; src: url(fonts/Archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'Noto Sans JP'; font-weight: 700; font-display: swap; src: url(fonts/NotoSansJP-bold.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
@font-face { font-family: 'Noto Sans JP'; font-weight: 450; font-display: swap; src: url(fonts/NotoSansJP-text.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
/* ============================================================
   Sensor Technology · páginas de operações (planejamento, parceiros)
   Mesmos tokens do app; tudo em rem — a raiz acompanha o tamanho da tela (do celular ao painel 4K).
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #05070B; --bg-2: #0B1017; --surface: #10161F; --surface-2: #151D28;
  --line: rgba(191, 211, 230, .14); --line-2: rgba(191, 211, 230, .28);
  --text: #EFECE6; --text-2: #B3BDCA; --text-3: #8792A8;
  --plat: #BFD3E6; --plat-2: #E8F1FB; --glow: #FFD27A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --r1: #cde2fb; --r2: #86b6ef; --r3: #3987e5; --r4: #256abf; --r5: #184f95;
  --font: 'Archivo', 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html { font-size: clamp(13px, min(1.11vw, 1.98vh), 46px); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
html[lang="ja"] body { line-break: strict; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plat); outline-offset: 3px; border-radius: 4px; }
p, h1, h2, h3, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }

/* ---------- gráficos ---------- */
.viz { position: relative; min-height: 0; }
.viz svg { display: block; width: 100%; height: 100%; overflow: visible; font-family: inherit; }
.viz svg [tabindex]:focus { outline: none; }
.viz svg [tabindex]:focus-visible { stroke: var(--plat); stroke-width: 1.5; }
.viz-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
.viz-tip { position: fixed; z-index: 90; pointer-events: none; max-width: 22rem; padding: .55rem .75rem; border-radius: .5rem; background: #1B2532; border: 1px solid var(--line-2); box-shadow: 0 .6rem 1.8rem rgba(0, 0, 0, .5); font-size: .78rem; line-height: 1.35; color: var(--text-2); }
.viz-tip[hidden] { display: none; }
.viz-tip-t { color: var(--text-2); margin-bottom: .25rem; }
.viz-tip-r { display: flex; align-items: baseline; gap: .45rem; white-space: nowrap; }
.viz-tip-r b { color: var(--text); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
.viz-key { flex: none; width: .9rem; height: 2px; border-radius: 2px; align-self: center; }

.segbar-bar { display: flex; gap: 2px; height: 1.75rem; max-height: 28px; min-height: 22px; border-radius: 6px; }
.segbar-seg { min-width: 2px; border-radius: 4px; display: flex; align-items: center; padding: 0 .5rem; overflow: visible; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.segbar-seg span[hidden] { display: none; }
.segbar-legend { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; margin-top: .7rem; font-size: .8rem; color: var(--text-2); }
.segbar-legend > span { display: inline-flex; align-items: center; gap: .5rem; }
.segbar-legend i { width: .75rem; height: .75rem; border-radius: 2px; flex: none; }

.meters { display: grid; gap: .55rem; }
.meter-row { display: grid; grid-template-columns: minmax(8rem, 38%) 1fr auto; align-items: center; gap: .9rem; font-size: .85rem; color: var(--text-2); }
.meter-track { height: .5rem; border-radius: 99px; background: rgba(57, 135, 229, .22); overflow: hidden; }
.meter-track i { display: block; height: 100%; border-radius: 99px; background: var(--s1); transform-origin: left center; }
.meter-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; }

/* barras empilhadas em linhas (várias composições lado a lado, uma legenda só) */
.stackrows { display: grid; gap: .5rem; }
.stackrows .segbar-legend { margin: 0 0 .45rem; }
.stack-row { display: grid; grid-template-columns: minmax(6.5rem, 11rem) minmax(0, 1fr); gap: .9rem; align-items: center; }
.stack-lbl { display: grid; line-height: 1.2; min-width: 0; }
.stack-lbl b { font-size: .92rem; font-weight: 600; color: var(--text); }
.stack-lbl span { font-size: .78rem; color: var(--text-3); }
@media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
  .stack-row { grid-template-columns: minmax(0, 1fr); gap: .25rem; }
  .stack-lbl { display: flex; gap: .5rem; align-items: baseline; }
}

/* ---------- peças comuns ---------- */
.stat { display: grid; gap: .1rem; }
.stat b { font-size: 2rem; line-height: 1.05; font-weight: 600; font-stretch: 105%; letter-spacing: -.01em; color: var(--text); }
.stat span { font-size: .85rem; color: var(--text-2); max-width: 17rem; }
.note { font-size: .78rem; color: var(--text-3); }
.btn { display: inline-flex; align-items: center; gap: .6rem; min-height: 2.9rem; padding: .7rem 1.35rem; border-radius: 999px; border: 1px solid var(--line-2); font-weight: 500; color: var(--text); text-decoration: none; transition: background .2s, border-color .2s; }
.btn:hover { background: rgba(191, 211, 230, .08); }
.btn:active { background: rgba(191, 211, 230, .16); }
.btn.primary { background: var(--plat); border-color: var(--plat); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: var(--plat-2); }
.btn svg { width: 1.15rem; height: 1.15rem; flex: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ============================================================
   Apresentação "Planejamento e controle" — layout do deck
   ============================================================ */
.deck { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background:
  radial-gradient(90rem 50rem at 85% -10%, rgba(57, 135, 229, .10), transparent 60%),
  radial-gradient(70rem 40rem at -10% 110%, rgba(191, 211, 230, .06), transparent 60%), var(--bg); }

/* topo */
.top { display: flex; align-items: center; gap: 1.2rem; padding: .9rem 2.4rem .6rem; min-height: 4rem; }
.top img { height: 2.5rem; width: auto; display: block; }
.top .name { color: var(--text-2); font-size: .95rem; padding-left: 1.2rem; border-left: 1px solid var(--line-2); white-space: nowrap; }
.top .sp { flex: 1; }
.langs { display: flex; gap: .25rem; }
.langs button { min-width: 2.7rem; min-height: 2.3rem; padding: .25rem .7rem; border-radius: 999px; border: 1px solid transparent; color: var(--text-3); font-size: .85rem; font-weight: 500; }
.langs button.on { color: var(--text); border-color: var(--line-2); background: rgba(191, 211, 230, .08); }
.top .x { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.3rem; padding: .25rem .95rem; border-radius: 999px; border: 1px solid var(--line-2); font-size: .85rem; color: var(--text-2); text-decoration: none; }
.top .x svg { width: 1rem; height: 1rem; }

/* palco e slides */
.stage { position: relative; min-height: 0; overflow: hidden; }
.slide { position: absolute; inset: 0; padding: 1.2rem 2.4rem 1rem; display: grid; grid-template-columns: minmax(0, 43fr) minmax(0, 57fr); gap: 3.2rem; align-items: center;
  opacity: 0; visibility: hidden; transform: translateX(2.2rem); transition: opacity .45s var(--ease), transform .55s var(--ease), visibility 0s .45s; }
.slide.on { opacity: 1; visibility: visible; transform: none; transition: opacity .45s var(--ease), transform .55s var(--ease), visibility 0s; }
.slide.before { transform: translateX(-2.2rem); }
.txt { display: grid; gap: 1.25rem; align-content: center; min-width: 0; }
.txt h1 { font-size: 2.65rem; line-height: 1.08; font-weight: 600; font-stretch: 108%; letter-spacing: -.015em; text-wrap: balance; }
html[lang="ja"] .txt h1 { font-size: 2.2rem; line-height: 1.3; letter-spacing: 0; font-stretch: 100%; word-break: auto-phrase; }
html[lang="de"] .txt h1 { font-size: 2.45rem; }
.txt .lead { font-size: 1.12rem; line-height: 1.55; color: var(--text-2); max-width: 36em; text-wrap: pretty; }
html[lang="ja"] .txt .lead { font-size: 1.02rem; line-height: 1.8; }
.fig { display: grid; gap: 1rem; min-width: 0; min-height: 0; align-content: center; height: 100%; }
.fig .viz { height: 24rem; }
.slide[data-id="market"] .fig .viz { height: 19rem; }
.slide[data-id="spool"] .fig .viz { height: 18.5rem; }
.slide[data-id="control"] .fig .viz { height: 22rem; max-width: 40rem; }
.fig .cap { font-size: .9rem; color: var(--text-2); }
.stats { display: flex; flex-wrap: wrap; gap: 1.1rem 2.4rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.stats.col { display: grid; gap: 1rem; }
.stats.two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem 2rem; }

/* capa */
.slide.cover { grid-template-columns: minmax(0, 1fr); align-content: center; gap: 2.6rem; padding-left: 5.5rem; padding-right: 5.5rem; }
.slide.cover h1 { font-size: 4.3rem; line-height: 1.02; font-stretch: 112%; max-width: 15em; }
html[lang="ja"] .slide.cover h1 { font-size: 3.1rem; line-height: 1.25; max-width: 20em; }
html[lang="de"] .slide.cover h1, html[lang="pt"] .slide.cover h1 { font-size: 3.9rem; max-width: 18em; }
.slide.cover .lead { font-size: 1.3rem; max-width: 40em; }
.tl { position: relative; height: 7.6rem; margin-top: .4rem; max-width: 70rem; }
.tl-axis { position: absolute; left: 0; right: 0; top: 3.9rem; height: 1px; background: var(--line-2); }
.tl-tick { position: absolute; top: 3.9rem; width: 1px; height: .5rem; background: var(--line-2); }
.tl-tick span { position: absolute; top: .75rem; left: 0; transform: translateX(-50%); font-size: .78rem; color: var(--text-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-tick:first-of-type span { transform: none; }
.tl-unit { position: absolute; right: 0; top: 4.65rem; font-size: .78rem; color: var(--text-3); }
.tl-bar { position: absolute; left: 0; top: 3.15rem; height: 1.5rem; max-height: 24px; border-radius: 0 4px 4px 0; background: var(--s1); transform-origin: left center; }
.tl-m { position: absolute; top: 0; font-size: .95rem; font-weight: 600; white-space: nowrap; }
.tl-m i { position: absolute; left: 0; top: 1.9rem; width: 2px; height: 3.3rem; background: var(--text-3); }
.tl-m.order i { background: var(--glow); }
.tl-m.order { transform: translateX(-100%); padding-right: .7rem; }
.tl-m.order i { left: auto; right: 0; }
.tl-m.ship { padding-left: .9rem; }
.tl-m.ship i { width: .8rem; height: .8rem; border-radius: 50%; top: 3.5rem; left: -.4rem; background: var(--text); box-shadow: 0 0 0 2px var(--bg); }
.tl-m.start { padding-left: .7rem; }
.slide.cover .note { font-size: .95rem; color: var(--text-2); max-width: 46em; }

/* regra, fórmula, etapas */
.rule { display: grid; gap: .5rem; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.rule h3 { font-size: .95rem; font-weight: 600; color: var(--text); }
.rule p { font-size: .92rem; color: var(--text-2); }
.rule ul { display: flex; flex-wrap: wrap; gap: .5rem 1.6rem; font-size: .92rem; color: var(--text-2); }
.rule li b { color: var(--text); font-weight: 600; }
.formula { font-size: 1.05rem; color: var(--text); padding: .9rem 1.1rem; border-left: 2px solid var(--plat); background: rgba(191, 211, 230, .05); border-radius: 0 .5rem .5rem 0; }
.hero-n { font-size: 6.2rem; line-height: .95; font-weight: 600; font-stretch: 112%; letter-spacing: -.03em; }
.hero-l { font-size: 1.02rem; color: var(--text-2); max-width: 24em; }
.steps { display: flex; align-items: stretch; gap: 0; counter-reset: st; }
.steps li { flex: 1 1 0; min-width: 0; position: relative; padding: .7rem .9rem .7rem 0; font-size: .86rem; line-height: 1.3; color: var(--text); border-top: 2px solid var(--s1); margin-right: .9rem; }
.steps li::before { counter-increment: st; content: counter(st); display: block; font-size: .78rem; color: var(--text-3); font-variant-numeric: tabular-nums; margin-bottom: .2rem; }
.steps li:last-child { margin-right: 0; }
.steps.big li { font-size: 1.05rem; padding: 1rem 1rem 1rem 0; }
.steps.big li::before { font-size: 1.6rem; color: var(--text); font-weight: 600; margin-bottom: .5rem; }

/* tabela ABC */
.abc-t { display: grid; grid-template-columns: auto 1fr auto; gap: .45rem 1.2rem; align-items: baseline; padding-top: 1.1rem; border-top: 1px solid var(--line); font-size: .98rem; color: var(--text-2); }
.abc-t b { color: var(--text); font-weight: 600; font-size: 1.25rem; }
.abc-t .v { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }

/* classes (esquema) */
.flow3 { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1.25fr) auto minmax(0, 1.3fr); gap: 1rem; align-items: center; }
.flow3 .box { border: 1px solid var(--line-2); border-radius: .6rem; padding: 1.2rem 1.25rem; font-size: 1.08rem; font-weight: 600; line-height: 1.3; background: rgba(16, 22, 31, .7); }
.flow3 .box small { display: block; margin-top: .55rem; color: var(--text-2); font-size: .88rem; font-weight: 400; line-height: 1.4; }
.flow3 .arr { width: 1.4rem; height: 1.4rem; color: var(--text-3); }
.cls { display: grid; gap: 2px; }
.cls li { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .8rem; padding: .78rem 1rem; font-size: 1.08rem; font-weight: 600; border-radius: 4px; font-variant-numeric: tabular-nums; }
.cls li small { font-weight: 500; opacity: .85; font-size: .88rem; }
.cls h3, .ord h3 { font-size: .9rem; font-weight: 500; color: var(--text-2); margin-bottom: .6rem; }
.ord { display: grid; gap: .4rem; }
.ord li { display: grid; grid-template-columns: auto 1fr; gap: .7rem; align-items: center; font-size: .85rem; color: var(--text-2); padding: .5rem .8rem; border: 1px solid var(--line); border-radius: .45rem; }
.ord li i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--plat); }

/* produtividade: um apontamento, quatro usos */
.rec { font-size: 1.15rem; font-weight: 500; color: var(--text); padding: 1.15rem 1.35rem; border: 1px solid var(--line-2); border-radius: .6rem; background: rgba(16, 22, 31, .7); }
.uses { display: grid; grid-template-columns: 1fr 1fr; gap: 0 2.2rem; }
.uses li { padding: 1.3rem 0; border-top: 1px solid var(--line); display: grid; gap: .2rem; }
.uses li b { font-size: 1.35rem; font-weight: 600; }
.uses li span { font-size: 1rem; color: var(--text-2); }
.link-v { width: 1px; height: 2rem; background: var(--line-2); margin: 0 auto; }

/* carreira */
.ladder { display: grid; gap: .5rem; }
.ladder { gap: .85rem; }
.ladder li { display: grid; grid-template-columns: minmax(9rem, 14rem) 1fr auto; gap: 1rem; align-items: center; font-size: 1.02rem; color: var(--text-2); }
.ladder li .bar { height: .75rem; border-radius: 0 4px 4px 0; background: var(--s1); min-width: 3px; transform-origin: left center; }
.ladder li b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 5.5rem; text-align: right; }
.track { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .8rem; padding-bottom: 1rem; margin-bottom: .4rem; border-bottom: 1px solid var(--line); font-size: .88rem; color: var(--text-2); }
.track b { color: var(--text-3); font-weight: 500; margin-right: .4rem; }
.track span { padding: .35rem .8rem; border: 1px solid var(--line-2); border-radius: 999px; color: var(--text); }

/* fornecedores */
.scale { display: grid; grid-template-columns: 45fr 30fr 15fr 10fr; gap: 2px; }
.scale div { padding: .55rem .7rem; border-radius: 4px; font-size: .82rem; font-weight: 600; display: grid; gap: .1rem; }
.scale div small { font-weight: 500; font-size: .74rem; opacity: .85; }
.fig h3 { font-size: .95rem; font-weight: 600; color: var(--text); }
.grp { display: grid; gap: .7rem; }

/* customização */
.chips { display: grid; gap: 0; }
.chips li { display: flex; align-items: center; gap: .9rem; padding: 1.05rem 0; border-top: 1px solid var(--line); font-size: 1.2rem; }
.chips li:last-child { border-bottom: 1px solid var(--line); }
.chips svg { width: 1.2rem; height: 1.2rem; color: var(--plat); flex: none; }

/* slide largo (texto em cima, figura embaixo) */
.slide.wide { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto; align-content: center; gap: 2.4rem; padding-left: 4rem; padding-right: 4rem; }
.slide.wide .txt { max-width: 60rem; }
.slide.center { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; align-content: center; gap: 2.2rem; }
.slide.center .txt { justify-items: center; }
.cta { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.4rem 2rem; }
.cta > div { display: grid; gap: .5rem; justify-items: center; }
.cta .btn { font-size: 1.1rem; padding: .95rem 1.8rem; min-height: 3.4rem; }
.cta small { font-size: .82rem; color: var(--text-3); }

/* rodapé de navegação */
.nav { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 1.4rem; padding: .7rem 2.4rem 1rem; }
.nav .arrow { width: 3.1rem; height: 3.1rem; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; color: var(--text); }
.nav .arrow:disabled { opacity: .3; cursor: default; }
.nav .arrow svg { width: 1.3rem; height: 1.3rem; }
.nav .arrow.next { background: var(--plat); border-color: var(--plat); color: var(--bg); }
.prog { display: grid; gap: .45rem; min-width: 0; }
.prog .ticks { display: flex; gap: 3px; }
.prog .ticks button { flex: 1 1 0; height: 1.6rem; position: relative; }
.prog .ticks button::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 3px; margin-top: -1.5px; border-radius: 2px; background: var(--line-2); transition: background .3s; }
.prog .ticks button.done::after { background: rgba(191, 211, 230, .55); }
.prog .ticks button.on::after { background: var(--plat-2); height: 5px; margin-top: -2.5px; }
.prog .ticks button.gap { margin-left: .5rem; }
.prog .lbl { font-size: .82rem; color: var(--text-3); display: flex; gap: .8rem; justify-content: space-between; }
.prog .lbl b { color: var(--text-2); font-weight: 500; }
.count { font-size: .9rem; color: var(--text-2); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- visão de parceiros ---------- */
.top .x.pv.on { color: var(--glow); border-color: rgba(255, 210, 122, .55); }
.prog .ticks button.p::after { background: rgba(255, 210, 122, .32); }
.prog .ticks button.p.done::after { background: rgba(255, 210, 122, .6); }
.prog .ticks button.p.on::after { background: var(--glow); }
.prog .lbl b em { font-style: normal; color: var(--glow); margin-left: .7rem; padding-left: .7rem; border-left: 1px solid var(--line-2); }
.pv-modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(3, 5, 8, .74); backdrop-filter: blur(6px); padding: 1.2rem; }
.pv-modal[hidden] { display: none; }
.pv-card { width: min(31rem, 100%); display: grid; gap: 1rem; padding: 2rem; border-radius: 1rem; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, .6); }
.pv-ic { width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: rgba(191, 211, 230, .1); color: var(--plat); }
.pv-ic svg { width: 1.4rem; height: 1.4rem; }
.pv-card h2 { margin: 0; font-size: 1.5rem; font-weight: 600; }
.pv-card p { font-size: .98rem; color: var(--text-2); line-height: 1.5; }
.pv-card label { display: grid; gap: .4rem; font-size: .85rem; color: var(--text-2); }
.pv-card label[hidden] { display: none; }
.pv-card input { font: inherit; font-size: 1.25rem; letter-spacing: .08em; font-variant-numeric: tabular-nums; padding: .8rem 1rem; border-radius: .6rem; border: 1px solid var(--line-2); background: var(--bg-2); color: var(--text); text-transform: uppercase; width: 100%; min-height: 3.2rem; }
.pv-card input::placeholder { color: var(--text-3); opacity: .7; }
.pv-card.busy input { opacity: .6; }
.pv-card .pv-msg { min-height: 1.5em; font-size: .9rem; color: var(--glow); }
.pv-act { display: flex; gap: .7rem; justify-content: flex-end; flex-wrap: wrap; }
.pv-toast { position: fixed; left: 50%; top: 4.7rem; transform: translateX(-50%); z-index: 55; padding: .7rem 1.25rem; border-radius: 999px; background: #1B2532; border: 1px solid rgba(255, 210, 122, .55); color: var(--text); font-size: .95rem; white-space: nowrap; box-shadow: 0 .6rem 2rem rgba(0, 0, 0, .5); }
.pv-toast[hidden] { display: none; }

/* ---------- a diferença de prazo ---------- */
.gapfig { display: grid; gap: 1.25rem; }
.gp-row { display: grid; grid-template-columns: minmax(9rem, 15.5rem) minmax(0, 1fr); gap: 1.4rem; align-items: center; }
.gp-l { display: grid; gap: .1rem; line-height: 1.25; }
.gp-l span { font-size: .85rem; color: var(--text-3); }
.gp-l b { font-size: 1.12rem; font-weight: 600; }
.gp-t { position: relative; height: 2.8rem; }
.gp-bar { position: absolute; left: 0; top: .65rem; height: 1.5rem; max-height: 24px; border-radius: 0 4px 4px 0; transform-origin: left center; }
.gp-bar.b1 { background: var(--s1); }
.gp-bar.b2 { background: var(--plat); border-radius: 0; }
.gp-bar.b2r { background: repeating-linear-gradient(135deg, rgba(191, 211, 230, .6) 0 6px, rgba(191, 211, 230, .22) 6px 12px); }
.gp-dot { position: absolute; left: 0; top: .65rem; width: 1.5rem; height: 1.5rem; max-width: 24px; max-height: 24px; margin-left: -.3rem; border-radius: 50%; background: var(--plat); box-shadow: 0 0 0 2px var(--bg); z-index: 1; }
.gp-gap { position: absolute; top: .1rem; bottom: .1rem; border: 1px dashed rgba(255, 210, 122, .8); border-left: 0; border-radius: 0 6px 6px 0; display: flex; align-items: center; justify-content: flex-end; padding: 0 .7rem 0 .5rem; min-width: 0; }
.gp-gap em { font-style: normal; font-size: .88rem; line-height: 1.15; font-weight: 600; color: var(--glow); text-align: right; text-wrap: balance; }
.gp-ax { margin-top: -.5rem; }
.gp-ax .gp-t { height: 2.6rem; border-top: 1px solid var(--line-2); }
.gp-ax .gp-t span { position: absolute; top: .4rem; transform: translateX(-50%); font-size: .78rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
.gp-ax .gp-t span:first-child { transform: none; }
.gp-ax .gp-t em { position: absolute; right: 0; top: 1.5rem; font-style: normal; font-size: .78rem; color: var(--text-3); }

/* ---------- confirmação de data ---------- */
.conf { display: grid; counter-reset: cf; }
.conf li { counter-increment: cf; display: grid; grid-template-columns: 2.4rem minmax(0, 1fr) auto; gap: 1rem; align-items: center; padding: 1.1rem 0; border-top: 1px solid var(--line); }
.conf li:last-child { border-bottom: 1px solid var(--line); }
.conf li::before { content: counter(cf); font-size: 1.9rem; line-height: 1; font-weight: 600; font-stretch: 110%; color: var(--text-3); font-variant-numeric: tabular-nums; }
.conf li div { display: grid; gap: .15rem; min-width: 0; }
.conf li b { font-size: 1.2rem; font-weight: 600; line-height: 1.25; }
.conf li span { font-size: .95rem; color: var(--text-2); }
.conf li em { font-style: normal; font-size: .95rem; font-weight: 600; padding: .45rem 1rem; border-radius: 999px; border: 1px solid var(--line-2); white-space: nowrap; }
.conf li:first-child em { background: var(--plat); border-color: var(--plat); color: var(--bg); }
.conf li:last-child em { border-color: rgba(255, 210, 122, .75); color: var(--glow); }

/* ---------- qualificação do fio (etapas em sequência) ---------- */
.gantt { display: grid; gap: .5rem; }
.gt-row { display: grid; grid-template-columns: minmax(9rem, 16.5rem) minmax(0, 1fr); gap: 1.2rem; align-items: center; }
.gt-l { display: grid; line-height: 1.25; }
.gt-l b { font-size: .98rem; font-weight: 600; }
.gt-l span { font-size: .82rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
.gt-t { position: relative; height: 2.1rem; background-image: linear-gradient(to right, var(--line) 1px, transparent 1px); background-size: calc(100% / 9) 100%; border-right: 1px solid var(--line); }
.gt-max, .gt-min { position: absolute; top: .45rem; height: 1.2rem; max-height: 20px; border-radius: 4px; }
.gt-max { background: rgba(57, 135, 229, .3); }
.gt-min { background: var(--s1); transform-origin: left center; }
.gt-row.tot { margin-top: .35rem; }
.gt-row.tot .gt-t { background-image: none; border-right: 0; height: 2.4rem; }
.gt-tot { position: absolute; top: .3rem; height: 1.8rem; max-height: 30px; border-radius: 4px; background: rgba(255, 210, 122, .2); border: 1px solid rgba(255, 210, 122, .85); }
.gt-row.two .gt-tot { border-style: dashed; background: rgba(255, 210, 122, .07); }
.gt-row.tot em { position: absolute; top: .5rem; font-style: normal; font-weight: 600; font-size: 1.05rem; line-height: 1.3; color: var(--glow); white-space: nowrap; padding: 0 .7rem; font-variant-numeric: tabular-nums; }
.gt-ax .gt-t { height: 2.6rem; background-image: none; border: 0; border-top: 1px solid var(--line-2); }
.gt-ax span { position: absolute; top: .4rem; transform: translateX(-50%); font-size: .78rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
.gt-ax span:first-child { transform: none; }
.gt-ax em { position: absolute; right: 0; top: 1.5rem; font-style: normal; font-size: .78rem; color: var(--text-3); }

/* ---------- materiais ---------- */
.matfig { display: grid; }
.matfig svg { width: 100%; height: auto; display: block; overflow: visible; }
.mat-l { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.2rem; }
.mat-l li { display: grid; gap: .3rem; align-content: start; justify-items: center; text-align: center; padding-top: .7rem; }
.mat-l i { width: 1.8rem; height: .3rem; border-radius: 2px; }
.mat-l b { font-size: 1.08rem; font-weight: 600; }
.mat-l span { font-size: .9rem; color: var(--text-2); line-height: 1.4; }
.core { font-size: 1.12rem; font-weight: 500; line-height: 1.45; color: var(--text); padding: 1rem 1.2rem; border-left: 2px solid var(--glow); background: rgba(255, 210, 122, .06); border-radius: 0 .5rem .5rem 0; margin-top: .5rem; }

/* ---------- sequência do processo, com retorno ---------- */
.loop { --g: .8rem; display: grid; }
.lp { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: var(--g); counter-reset: lp; }
.lp li { counter-increment: lp; display: grid; gap: .3rem; align-content: start; padding: 1rem .9rem 1.1rem; border: 1px solid var(--line-2); border-radius: .6rem; background: rgba(16, 22, 31, .7); min-height: 8.4rem; }
.lp li::before { content: counter(lp); font-size: .8rem; color: var(--text-3); font-variant-numeric: tabular-nums; }
.lp li b { font-size: 1.08rem; font-weight: 600; line-height: 1.25; }
.lp li span { font-size: .85rem; color: var(--text-2); line-height: 1.35; }
.lp li:nth-child(1), .lp li:nth-child(4) { border-color: rgba(255, 210, 122, .6); }
.lp-fb { --c: calc((100% - 4 * var(--g)) / 5); margin-left: calc(var(--c) / 2); width: calc(3 * var(--c) + 3 * var(--g)); height: 2.3rem; border: 2px solid rgba(255, 210, 122, .8); border-top: 0; border-radius: 0 0 .8rem .8rem; position: relative; }
.lp-fb i { position: absolute; left: calc(-.42rem - 1px); top: -.3rem; width: 0; height: 0; border-left: .42rem solid transparent; border-right: .42rem solid transparent; border-bottom: .7rem solid #FFD27A; }
.lp-t { --c: calc((100% - 4 * var(--g)) / 5); margin: .8rem 0 0 calc(var(--c) / 2 - 2rem); width: calc(3 * var(--c) + 3 * var(--g) + 4rem); text-align: center; font-size: 1rem; color: var(--text); line-height: 1.45; }

/* ---------- cabo de guerra: resistência × alfa ---------- */
.tug { display: grid; gap: .9rem; }
.tug svg { width: 100%; height: auto; display: block; overflow: visible; }
.tug svg text { font-family: inherit; }
.tug-mv { transition: transform 1.15s cubic-bezier(.3, 1.25, .5, 1); }
.tug-st { display: flex; flex-wrap: wrap; align-items: center; gap: .6rem 1rem; min-height: 2.7rem; }
.tug-st .chip { display: inline-flex; align-items: center; gap: .45rem; padding: .35rem .9rem .35rem .45rem; border-radius: 999px; border: 1px solid var(--line-2); font-size: .92rem; white-space: nowrap; }
.tug-st .chip i { width: 1.4rem; height: 1.4rem; border-radius: 50%; display: grid; place-items: center; }
.tug-st .chip i svg { width: .85rem; height: .85rem; stroke-width: 3; }
.tug-st .chip.ok i { background: rgba(12, 163, 12, .28); color: #7BE07B; }
.tug-st .chip.no { border-color: rgba(208, 59, 59, .7); }
.tug-st .chip.no i { background: rgba(208, 59, 59, .3); color: #FF9D94; }
.tug-st .chip b { font-weight: 600; }
.tug-st .chip span { color: var(--text-2); }
.tug-st p { font-size: 1.02rem; font-weight: 500; flex: 1 1 14rem; }
.tug-st p.no { color: #FFB3AC; }
.tug-b { display: flex; flex-wrap: wrap; gap: .6rem; }
.tug-b .btn { min-height: 2.7rem; padding: .5rem 1.15rem; font-size: .95rem; }
.tug-b .btn[aria-pressed="true"] { background: rgba(191, 211, 230, .14); border-color: var(--plat); }

/* ---------- fechamento ---------- */
.slide.closing .txt { gap: 1.7rem; max-width: 66rem; }
.slide.closing .lead { font-size: 1.3rem; max-width: 42em; }
.pillars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1rem; width: 100%; text-align: left; }
.pillars li { display: grid; gap: .6rem; align-content: start; padding: 1.1rem 1.15rem; border: 1px solid var(--line-2); border-radius: .7rem; background: rgba(16, 22, 31, .7); font-size: 1.08rem; font-weight: 500; line-height: 1.3; }
.pillars svg { width: 1.3rem; height: 1.3rem; color: var(--plat); }
.slide.closing h1 { font-size: 3rem; max-width: 20em; }
html[lang="ja"] .slide.closing h1 { font-size: 2.4rem; }
.thanks { font-size: 1.1rem; color: var(--text-2); }

/* ---------- slides de parceiros ---------- */
.slide[data-id="mix"] .fig .viz { height: 22rem; }
.slide[data-id="cost"] .fig .viz { height: 23rem; }
.slide[data-id="costmix"] .fig { gap: .7rem; }
.slide[data-id="costmix"] .fig .sc { height: 15.5rem; margin-top: .2rem; }
.slide[data-id="costmix"] .fig .cap + div + .cap { margin-top: .9rem; }
.quote { font-size: 1rem; line-height: 1.5; color: var(--text); padding: .8rem 1rem; border-left: 2px solid var(--plat); background: rgba(191, 211, 230, .05); border-radius: 0 .5rem .5rem 0; max-width: 36em; }
.dem { font-size: .95rem; color: var(--text-2); line-height: 1.5; max-width: 38em; }
.rng { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1.6rem; align-items: baseline; padding-top: 1.1rem; border-top: 1px solid var(--line); }
.rng h3 { grid-column: 1 / -1; font-size: .9rem; font-weight: 500; color: var(--text-2); }
.rng b { font-size: 1.1rem; font-weight: 600; }
.rng span { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.slide.ex { grid-template-columns: minmax(0, 37fr) minmax(0, 63fr); }
.ex-tag { justify-self: start; font-size: .85rem; font-weight: 600; color: var(--glow); padding: .3rem .85rem; border: 1px dashed rgba(255, 210, 122, .75); border-radius: 999px; }
.slide.ex .fig { gap: .8rem; }
.slide.ex .fig h3 { font-size: .9rem; font-weight: 500; color: var(--text-2); }
.ex-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .7rem; }
.ex-cards li { display: grid; gap: .2rem; align-content: start; padding: .85rem .9rem; border: 1px solid var(--line-2); border-radius: .6rem; background: rgba(16, 22, 31, .7); }
.ex-cards span { font-size: .8rem; color: var(--text-2); line-height: 1.25; min-height: 2.5em; }
.ex-cards b { font-size: 1.25rem; font-weight: 600; line-height: 1.15; font-variant-numeric: tabular-nums; }
.ex-cards small { font-size: .8rem; color: var(--text-3); line-height: 1.3; }
.ex-y { font-size: .95rem; color: var(--text); padding: .6rem .9rem; border-left: 2px solid var(--plat); background: rgba(191, 211, 230, .05); border-radius: 0 .5rem .5rem 0; }
.ex-st { display: grid; gap: .8rem; padding-top: 1rem; border-top: 1px solid var(--line); min-height: 16rem; align-content: start; }
.ex-q { font-size: 1.3rem; font-weight: 600; line-height: 1.3; }
.ex-row { display: flex; flex-wrap: wrap; gap: .6rem; }
.ex-row .btn { min-height: 3rem; font-size: 1.02rem; }
.ex-a { font-size: 1rem; color: var(--text-2); line-height: 1.5; }
.ex-a b { color: var(--text); font-weight: 600; }
.ex-news { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; }
.ex-news > div { display: grid; gap: .35rem; align-content: start; padding: .85rem 1rem; border-radius: .6rem; border: 1px solid var(--line-2); font-size: .92rem; line-height: 1.45; color: var(--text-2); }
.ex-news b { font-size: 1rem; color: var(--text); font-weight: 600; }
.ex-news .good { border-color: rgba(25, 158, 112, .75); background: rgba(25, 158, 112, .08); }
.ex-news .bad { border-color: rgba(217, 89, 38, .75); background: rgba(217, 89, 38, .07); }
.ex-conf { font-size: 1.15rem; font-weight: 600; line-height: 1.4; }
.ex-moral { font-size: .92rem; color: var(--text-2); line-height: 1.5; }

/* ---------- ajustes finos: rótulos de eixo, japonês por frase, janelas estreitas ---------- */
.gp-ax .gp-t span, .gp-ax .gp-t em, .gt-ax span, .gt-ax em { white-space: nowrap; }
html[lang="ja"] .lp li b, html[lang="ja"] .lp li span, html[lang="ja"] .lp-t, html[lang="ja"] .ex-cards li *, html[lang="ja"] .conf li b, html[lang="ja"] .conf li span, html[lang="ja"] .pillars li,
html[lang="ja"] .gp-l b, html[lang="ja"] .gt-l b, html[lang="ja"] .mat-l span, html[lang="ja"] .ex-q, html[lang="ja"] .ex-a, html[lang="ja"] .ex-news span, html[lang="ja"] .ex-conf, html[lang="ja"] .core, html[lang="ja"] .quote,
html[lang="ja"] .slide.closing .lead, html[lang="ja"] .stat span, html[lang="ja"] .tug-st p, html[lang="ja"] .gp-gap em { word-break: auto-phrase; }
.lp li b, .lp li span { overflow-wrap: anywhere; hyphens: auto; }
@media (max-width: 1180px) {
  .lp li { padding: .8rem .55rem .9rem; }
  .lp li b { font-size: .95rem; }
  .lp li span { font-size: .8rem; }
  .ex-cards li { padding: .7rem .65rem; }
}

/* ---------- celular: página em rolagem, um slide abaixo do outro ---------- */
@media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
  html { font-size: 16px; }
  body { overflow: auto; }
  .deck { position: static; display: block; min-height: 100%; }
  .top { position: sticky; top: 0; z-index: 5; background: rgba(5, 7, 11, .92); backdrop-filter: blur(8px); padding: .6rem 1rem; gap: .6rem; flex-wrap: wrap; }
  .top img { height: 2rem; }
  .top .name { display: none; }
  .langs button { min-width: 2.4rem; padding: .2rem .5rem; }
  .stage { position: static; overflow: visible; }
  .slide, .slide.wide, .slide.cover, .slide.center { position: static; opacity: 1; visibility: visible; transform: none; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; gap: 1.6rem; padding: 2.6rem 1.15rem; border-bottom: 1px solid var(--line); }
  .txt h1, html[lang] .txt h1 { font-size: 1.75rem; }
  .slide.cover h1, html[lang] .slide.cover h1 { font-size: 2.2rem; }
  .slide.cover .lead { font-size: 1.05rem; }
  .txt .lead, html[lang] .txt .lead { font-size: 1rem; }
  .fig { height: auto; }
  .fig .viz { height: 17rem; max-height: none; }
  .hero-n { font-size: 4.2rem; }
  .steps, .steps.big { display: grid; gap: .2rem; }
  .steps li, .steps.big li { margin-right: 0; border-top: 0; border-left: 2px solid var(--s1); padding: .5rem 0 .5rem .9rem; display: flex; gap: .7rem; align-items: baseline; font-size: .95rem; }
  .steps li::before, .steps.big li::before { font-size: .85rem; font-weight: 500; color: var(--text-3); margin: 0; }
  .flow3 { grid-template-columns: minmax(0, 1fr); }
  .flow3 .arr { transform: rotate(90deg); margin: 0 auto; }
  .uses { grid-template-columns: 1fr; }
  .stats.two { grid-template-columns: 1fr; }
  .ladder li { grid-template-columns: minmax(0, 1fr) auto; }
  .ladder li .bar { grid-column: 1 / -1; order: 3; }
  .tl { height: 8.4rem; }
  .tl-unit { display: none; }
  .tl-m.ship { max-width: 5.2rem; }
  .tl-m { font-size: .8rem; white-space: normal; max-width: 6.5rem; line-height: 1.2; }
  .nav { display: none; }
  .slide.center { text-align: left; justify-items: start; }
  .slide.center .txt { justify-items: start; }
  .cta { justify-content: flex-start; }
  .cta > div { justify-items: start; }
  .top .x.pv span { display: none; }
  .gp-row, .gt-row { grid-template-columns: minmax(0, 1fr); gap: .35rem; }
  .gp-ax .gp-l, .gt-ax .gt-l { display: none; }
  .gp-gap em { font-size: .78rem; }
  .gt-row.tot em { font-size: .9rem; padding: 0 .4rem; }
  .conf li { grid-template-columns: 1.8rem minmax(0, 1fr); }
  .conf li em { grid-column: 2; justify-self: start; }
  .mat-l { grid-template-columns: minmax(0, 1fr); gap: .2rem; }
  .mat-l li { justify-items: start; text-align: left; grid-template-columns: auto 1fr; column-gap: .7rem; align-items: baseline; }
  .mat-l li span { grid-column: 2; }
  .lp { grid-template-columns: minmax(0, 1fr); }
  .lp li { min-height: 0; }
  .lp-fb { display: none; }
  .lp-t { margin: .8rem 0 0; width: auto; text-align: left; padding-left: .9rem; border-left: 2px solid rgba(255, 210, 122, .8); }
  .pillars { grid-template-columns: minmax(0, 1fr); }
  .slide.closing h1, html[lang] .slide.closing h1 { font-size: 1.9rem; }
  .slide.ex { grid-template-columns: minmax(0, 1fr); }
  .ex-cards { grid-template-columns: 1fr 1fr; }
  .ex-news { grid-template-columns: minmax(0, 1fr); }
  .ex-st { min-height: 0; }
  .slide[data-id="costmix"] .fig .sc { height: 27rem; }
  .pv-toast { top: auto; bottom: 1.2rem; white-space: normal; text-align: center; width: max-content; max-width: 90vw; }
}

</style>
</head>

<script>
/* ============================================================
   Sensor Technology · gráficos (SVG puro, sem bibliotecas)
   Regras: marcas finas, eixo único, grade em fio contínuo, texto sempre nas cores de texto,
   dica (tooltip) em todos os gráficos, tabela equivalente para leitores de tela.
   ============================================================ */
const Viz = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const C = {
    s1: '#3987e5', s2: '#d95926', s3: '#199e70', s4: '#c98500',
    ramp: ['#cde2fb', '#86b6ef', '#3987e5', '#256abf', '#184f95'],
    mute: '#3a4658', grid: 'rgba(191,211,230,.13)', axis: 'rgba(191,211,230,.30)',
    text: '#EFECE6', text2: '#B3BDCA', text3: '#8792A8', surface: '#05070B', glow: '#FFD27A',
    good: '#0ca30c', warn: '#fab219', bad: '#d03b3b',
  };
  let LOCALE = 'en-US';
  const setLocale = (l) => { LOCALE = l; };
  const nf = (d) => new Intl.NumberFormat(LOCALE, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  const fmt = (v, d) => nf(d).format(v);
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(name, attrs, parent, text) {
    const n = document.createElementNS(NS, name);
    if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, cls, parent, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- dica (uma só para a página) ---------- */
  let tip;
  function tipEl() {
    if (!tip) { tip = h('div', 'viz-tip', document.body); tip.setAttribute('role', 'status'); tip.hidden = true; }
    return tip;
  }
  // rows: [[rótulo, valor, cor?]]; title opcional. Tudo via textContent.
  function showTip(x, y, title, rows) {
    const t = tipEl(); t.textContent = '';
    if (title) h('div', 'viz-tip-t', t, title);
    (rows || []).forEach(([label, value, color]) => {
      const r = h('div', 'viz-tip-r', t);
      if (color) { const k = h('i', 'viz-key', r); k.style.background = color; }
      h('b', '', r, value); h('span', '', r, label);
    });
    t.hidden = false;
    const z = (parseFloat(document.documentElement.style.zoom) || 1);
    const vw = window.innerWidth / z, vh = window.innerHeight / z;
    const w = t.offsetWidth, hh = t.offsetHeight, pad = 12;
    let left = x / z + 14, top = y / z - hh - 12;
    if (left + w + pad > vw) left = x / z - w - 14;
    if (left < pad) left = pad;
    if (top < pad) top = y / z + 18;
    if (top + hh + pad > vh) top = vh - hh - pad;
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }
  // liga a dica a um elemento (mouse, toque e foco)
  function bindTip(node, title, rows) {
    const on = (e) => { const p = e.touches ? e.touches[0] : e; let x = p.clientX, y = p.clientY; if (x == null) { const b = node.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; } showTip(x, y, typeof title === 'function' ? title() : title, typeof rows === 'function' ? rows() : rows); };
    node.addEventListener('pointerenter', on); node.addEventListener('pointermove', on);
    node.addEventListener('pointerleave', hideTip); node.addEventListener('focus', on); node.addEventListener('blur', hideTip);
    node.addEventListener('pointerdown', on);
  }
  document.addEventListener('scroll', hideTip, true);

  /* ---------- tabela equivalente (leitor de tela) ---------- */
  function table(host, caption, head, rows) {
    const t = h('table', '', h('div', 'viz-sr', host)); // a tabela vai dentro de um bloco recortado (tabela não respeita width/overflow)
    h('caption', '', t, caption || '');
    const tr = h('tr', '', h('thead', '', t)); head.forEach((x) => h('th', '', tr, x));
    const tb = h('tbody', '', t);
    rows.forEach((r) => { const rr = h('tr', '', tb); r.forEach((x) => h('td', '', rr, String(x))); });
  }

  /* ---------- base: mede o contêiner, cria o SVG e redesenha no resize ---------- */
  function mount(host, draw) {
    host.classList.add('viz');
    let raf = 0, last = '';
    const render = (animate) => {
      const w = host.clientWidth, hgt = host.clientHeight;
      if (w < 40 || hgt < 40) return;
      const key = w + 'x' + hgt + '@' + rem() + LOCALE;
      if (!animate && key === last) return;
      last = key;
      host.textContent = '';
      const svg = el('svg', { viewBox: `0 0 ${w} ${hgt}`, width: w, height: hgt, role: 'img' }, host);
      draw({ svg, w, h: hgt, r: rem(), animate: !!animate && !reduced(), host });
    };
    if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(false)); }).observe(host);
    host._render = render;
    render(false);
    return { render, replay: () => render(true) };
  }
  const ticks = (max, n) => {
    const raw = max / (n || 4), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; const out = [];
    for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  };
  function grow(node, attr, from, to, ms, delay) {
    if (!node.animate) { node.setAttribute(attr, to); return; }
    const a = el('animate', { attributeName: attr, from, to, dur: (ms || 700) + 'ms', begin: 'indefinite', fill: 'freeze', calcMode: 'spline', keySplines: '.2 .7 .2 1', keyTimes: '0;1' }, node);
    node.setAttribute(attr, from);
    setTimeout(() => { try { a.beginElement(); } catch (e) { node.setAttribute(attr, to); } }, delay || 0);
    setTimeout(() => node.setAttribute(attr, to), (delay || 0) + (ms || 700) + 60);
  }
  function fadeIn(node, ms, delay) {
    if (!node.animate) return;
    node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms || 500, delay: delay || 0, fill: 'both', easing: 'ease-out' });
  }

  /* ---------- colunas (histograma / séries curtas) ----------
     o: { labels[], values[], unit:'%', dec, title(i)→str, rowLabel, xTitle, yMax, color, colors[i], marks:[{at, text}], labelEvery, valueLabels:'all'|[i…]|null,
          caption, head:[x,y] } */
  function columns(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.values.length;
      const m = { l: r * 2.4, r: r * 0.6, t: r * (o.marks ? 2.2 : 1.2), b: r * (o.xTitle ? 2.9 : 1.8) };
      const pw = w - m.l - m.r, ph = H - m.t - m.b;
      const max = o.yMax || Math.max.apply(null, o.values) * 1.12;
      const tk = ticks(max, 4), top = Math.max(max, tk[tk.length - 1]);
      const y = (v) => m.t + ph - (v / top) * ph, band = pw / n, bw = Math.min(24 * (r / 16), band - 2, band * 0.72);
      const g = el('g', { 'font-size': fs, 'font-family': 'inherit' }, svg);
      tk.forEach((v) => {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? C.axis : C.grid, 'stroke-width': 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, fmt(v, 0) + (o.unit || ''));
      });
      const every = o.labelEvery || (band < fs * 2.2 ? Math.ceil(fs * 2.2 / band) : 1);
      o.values.forEach((v, i) => {
        const x = m.l + band * i + (band - bw) / 2, yy = y(v), hh = Math.max(0, m.t + ph - yy), rad = Math.min(4, bw / 2, hh);
        const col = (o.colors && o.colors[i]) || o.color || C.s1;
        const path = (top_) => `M${x},${m.t + ph}V${top_ + rad}q0,-${rad} ${rad},-${rad}h${bw - 2 * rad}q${rad},0 ${rad},${rad}V${m.t + ph}Z`;
        const p = el('path', { d: path(yy), fill: col }, g);
        if (animate && hh > 1 && p.animate) { p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 100%';
          p.animate([{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], { duration: 650, delay: 120 + i * 28, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }); }
        if (i % every === 0 || i === n - 1) el('text', { x: x + bw / 2, y: m.t + ph + fs * 1.5, 'text-anchor': 'middle', fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, o.labels[i]);
        const showVal = o.valueLabels === 'all' || (Array.isArray(o.valueLabels) && o.valueLabels.includes(i));
        if (showVal) { const t = el('text', { x: x + bw / 2, y: yy - fs * 0.55, 'text-anchor': 'middle', fill: C.text, 'font-weight': 600, style: 'font-variant-numeric: tabular-nums' }, g, fmt(v, o.dec || 0) + (o.unit || '')); if (animate) fadeIn(t, 400, 500 + i * 28); }
        const hit = el('rect', { x: m.l + band * i, y: m.t, width: band, height: ph, fill: 'transparent', tabindex: 0, 'aria-label': (o.title ? o.title(i) : o.labels[i]) + ': ' + fmt(v, o.dec || 0) + (o.unit || '') }, g);

  /* ---------- curva ABC: barras (participação) + linha (acumulado), um eixo só (%) ----------
     o: { shares[], A, B, zone:{A,B,C}, tipItem(i), lblShare, lblCum, caption } */
  function pareto(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.shares.length;
      const m = { l: r * 2.6, r: r * 0.8, t: r * 1.9, b: r * 1.4 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b, band = pw / n, bw = Math.max(2, Math.min(24, band - 2));
      const y = (v) => m.t + ph - (v / 100) * ph, xC = (i) => m.l + band * i + band / 2;
      const g = el('g', { 'font-size': fs }, svg);
      const zones = [[0, o.A, o.zone.A, 'rgba(57,135,229,.13)'], [o.A, o.A + o.B, o.zone.B, 'rgba(57,135,229,.065)'], [o.A + o.B, n, o.zone.C, 'transparent']];
      zones.forEach(([a, b, label, fill]) => {
        el('rect', { x: m.l + band * a, y: m.t, width: band * (b - a), height: ph, fill }, g);
        el('text', { x: m.l + band * a + r * 0.4, y: m.t - r * 0.55, fill: C.text2, 'font-weight': 600 }, g, label);
        if (a > 0) el('line', { x1: m.l + band * a, x2: m.l + band * a, y1: m.t - r * 1.2, y2: m.t + ph, stroke: C.axis, 'stroke-width': 1 }, g);
      });
      [0, 25, 50, 75, 100].forEach((v) => {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? C.axis : C.grid, 'stroke-width': 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, v + '%');
      });
      let cum = 0; const pts = [];
      o.shares.forEach((v, i) => {
        cum += v; pts.push([xC(i), y(Math.min(100, cum))]);
        const x = m.l + band * i + (band - bw) / 2, yy = y(v), hh = m.t + ph - yy, rad = Math.min(4, bw / 2, hh);
        const d = hh < 0.6 ? `M${x},${m.t + ph - 1}h${bw}v1h-${bw}Z` : `M${x},${m.t + ph}V${yy + rad}q0,-${rad} ${rad},-${rad}h${bw - 2 * rad}q${rad},0 ${rad},${rad}V${m.t + ph}Z`;
        const p = el('path', { d, fill: C.s1 }, g);

        bindTip(hit, o.tipItem(i), [[o.lblShare, fmt(v, 1) + '%', C.s1], [o.lblCum, fmt(c, 1) + '%', C.text]]);
      });
      const line = el('path', { d: 'M' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: C.text, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
      if (animate && line.getTotalLength) { const L = line.getTotalLength(); line.style.strokeDasharray = L; line.animate && line.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1100, delay: 350, easing: 'ease-out', fill: 'both' }).finished.then(() => { line.style.strokeDasharray = ''; }).catch(() => {}); }
      // marcadores nos cortes A e B, com rótulo direto
      [[o.A - 1, o.cumA], [o.A + o.B - 1, o.cumB]].forEach(([i, v], k) => {
        const [px, py] = pts[i];
        el('circle', { cx: px, cy: py, r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2 }, g);
        const t = el('text', { x: px + 10, y: py + fs * 1.25, fill: C.text, 'font-weight': 600, style: 'font-variant-numeric: tabular-nums' }, g, fmt(v, 0) + '%');
        if (animate) fadeIn(t, 400, 900 + k * 200);
      });
      // legenda (2 séries)
      const lg = el('g', { transform: `translate(${w - m.r}, ${m.t + ph * 0.56})` }, g);
      const l1 = el('text', { x: 0, y: 0, 'text-anchor': 'end', fill: C.text2 }, lg, o.lblCum);
      el('line', { x1: -(l1.getComputedTextLength ? l1.getComputedTextLength() : 120) - 26, x2: -(l1.getComputedTextLength ? l1.getComputedTextLength() : 120) - 8, y1: -fs * 0.32, y2: -fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      const l2 = el('text', { x: 0, y: fs * 1.6, 'text-anchor': 'end', fill: C.text2 }, lg, o.lblShare);
      el('rect', { x: -(l2.getComputedTextLength ? l2.getComputedTextLength() : 120) - 22, y: fs * 1.6 - fs * 0.78, width: 12, height: fs * 0.8, rx: 2, fill: C.s1 }, lg);
      svg.setAttribute('aria-label', o.caption || '');
      let c2 = 0; table(host, o.caption, ['#', o.lblShare, o.lblCum], o.shares.map((v, i) => { c2 += v; return [i + 1, fmt(v, 2) + '%', fmt(Math.min(100, c2), 1) + '%']; }));
    });
  }

  /* ---------- série mensal longa: área (mensal) + linha (média móvel de 12 meses), um eixo (índice) ----------
     o: { idx[], roll[], first:'YYYY-MM', lblMonth, lblRoll, fmtMonth(date)→str, caption } */
  function longSeries(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.idx.length;
      const narrow = w < 560;
      const m = { l: r * 0.4, r: r * 0.4, t: r * (narrow ? 3.1 : 1.6), b: r * 1.7 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b;
      const x = (i) => m.l + (i / (n - 1)) * pw, y = (v) => m.t + ph - (v / 105) * ph;
      const [y0, m0] = o.first.split('-').map(Number);
      const g = el('g', { 'font-size': fs }, svg);
      el('line', { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: C.axis, 'stroke-width': 1 }, g);
      for (let i = 0; i < n; i++) { const mo = (m0 - 1 + i) % 12, yr = y0 + Math.floor((m0 - 1 + i) / 12);
        if (mo === 0 && (yr % 2 === 1 || pw / (n / 12) > fs * 3.2)) { el('line', { x1: x(i), x2: x(i), y1: m.t, y2: y(0), stroke: C.grid, 'stroke-width': 1 }, g); el('text', { x: x(i) + 4, y: y(0) + fs * 1.45, fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, String(yr)); } }
      const area = 'M' + o.idx.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L') + `L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`;
      const a = el('path', { d: area, fill: C.s1, opacity: .16 }, g);
      const thin = el('path', { d: 'M' + o.idx.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L'), fill: 'none', stroke: C.s1, 'stroke-width': 1, opacity: .55, 'stroke-linejoin': 'round' }, g);
      const rp = o.roll.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
      const line = el('path', { d: 'M' + rp.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: C.text, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
      if (animate) { fadeIn(a, 700, 100); fadeIn(thin, 700, 100); if (line.getTotalLength && line.animate) { const L = line.getTotalLength(); line.style.strokeDasharray = L; line.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1500, delay: 300, easing: 'ease-out', fill: 'both' }).finished.then(() => { line.style.strokeDasharray = ''; }).catch(() => {}); } }
      const last = rp[rp.length - 1]; el('circle', { cx: last[0], cy: last[1], r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2 }, g);
      // legenda no alto
      const lg = el('g', { transform: `translate(${m.l}, ${m.t - r * 0.7})` }, g);
      const y1 = narrow ? -fs * 1.55 : 0;
      el('line', { x1: 0, x2: 18, y1: y1 - fs * 0.32, y2: y1 - fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      const t1 = el('text', { x: 26, y: y1, fill: C.text2 }, lg, o.lblRoll);
      const off = narrow ? 0 : 26 + (t1.getComputedTextLength ? t1.getComputedTextLength() : 160) + 28;
      el('rect', { x: off + (narrow ? 3 : 0), y: -fs * 0.78, width: 12, height: fs * 0.8, rx: 2, fill: C.s1, opacity: .5 }, lg);
      el('text', { x: off + (narrow ? 26 : 20), y: 0, fill: C.text2 }, lg, o.lblMonth);
      // mira + dica
      const cross = el('line', { y1: m.t, y2: y(0), stroke: C.axis, 'stroke-width': 1, visibility: 'hidden' }, g);
      const dot = el('circle', { r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2, visibility: 'hidden' }, g);
      const hit = el('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'transparent', tabindex: 0, 'aria-label': o.caption || '' }, g);
      const move = (e) => { const b = svg.getBoundingClientRect(); const px = ((e.clientX - b.left) / b.width) * w; const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / pw) * (n - 1))));
        cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
        if (o.roll[i] != null) { dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(o.roll[i])); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
        const d = new Date(y0, m0 - 1 + i, 1);
        showTip(e.clientX, e.clientY, o.fmtMonth(d), [[o.lblRoll, o.roll[i] == null ? '–' : fmt(o.roll[i], 0), C.text], [o.lblMonth, fmt(o.idx[i], 0), C.s1]]); };
      hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
      hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip(); });
      svg.setAttribute('aria-label', o.caption || '');
      const rows = []; for (let i = 11; i < n; i += 12) { const d = new Date(y0, m0 - 1 + i, 1); rows.push([o.fmtMonth(d), fmt(o.idx[i], 0), o.roll[i] == null ? '–' : fmt(o.roll[i], 0)]); }
      table(host, o.caption, ['', o.lblMonth, o.lblRoll], rows);
    });
  }

  /* ---------- pontos por grupo (carretéis por lote), eixo único (índice, 100 = média) ----------
     o: { points:[{lot, sp, idx, n}], lots:[{lot, idx, n}], lblLot(l), tipTitle(p), lblIdx, lblPcs, lblAvg, lblLotAvg, yMin, yMax, caption } */
  function strip(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), lots = o.lots.map((l) => l.lot), n = lots.length;

      const lo = o.yMin || 70, hi = o.yMax || 125, y = (v) => m.t + ph - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * ph;
      const g = el('g', { 'font-size': fs }, svg);
      for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 100 ? C.axis : C.grid, 'stroke-width': v === 100 ? 1.5 : 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: v === 100 ? C.text : C.text3, 'font-weight': v === 100 ? 600 : 400, style: 'font-variant-numeric: tabular-nums' }, g, String(v));
      }
      const maxN = Math.max.apply(null, o.points.map((p) => p.n || 1));
      lots.forEach((lot, li) => {
        const cx = m.l + band * li + band / 2;
        if (li > 0) el('line', { x1: m.l + band * li, x2: m.l + band * li, y1: m.t, y2: m.t + ph, stroke: C.grid, 'stroke-width': 1 }, g);
        el('text', { x: cx, y: m.t + ph + fs * 1.6, 'text-anchor': 'middle', fill: C.text3 }, g, o.lblLot(lot));
        const L = o.lots[li];
        const tick = el('line', { x1: cx - band * 0.34, x2: cx + band * 0.34, y1: y(L.idx), y2: y(L.idx), stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
        if (animate) fadeIn(tick, 400, 700 + li * 60);
        const ps = o.points.filter((p) => p.lot === lot);
        ps.forEach((p, k) => {
          const off = ps.length > 1 ? ((k / (ps.length - 1)) - 0.5) * band * 0.56 : 0;
          const rad = p.sz ? [5, 5, 7, 9][p.sz] : Math.max(4, Math.min(9, 4 + 5 * Math.sqrt(p.n / maxN)));
          const c = el('circle', { cx: cx + off, cy: y(p.idx), r: rad, fill: C.s1, stroke: C.surface, 'stroke-width': 2, tabindex: 0, 'aria-label': o.tipTitle(p) + ': ' + fmt(p.idx, 0) }, g);
          if (animate && c.animate) c.animate([{ opacity: 0, transform: 'translateY(-14px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 150 + li * 60 + k * 30, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
          const hit = el('circle', { cx: cx + off, cy: y(p.idx), r: 14, fill: 'transparent' }, g);
          const rows = [[o.lblIdx, fmt(p.idx, 0), C.s1]].concat(p.n != null ? [[o.lblPcs, fmt(p.n, 0)]] : [], [[o.lblLotAvg, fmt(L.idx, 0), C.text]]);
          bindTip(hit, o.tipTitle(p), rows); bindTip(c, o.tipTitle(p), rows);
        });
      });
      // legenda
      const lg = el('g', { transform: `translate(${m.l + r * 0.4}, ${m.t - r * 0.55})` }, g);
      el('circle', { cx: 6, cy: -fs * 0.32, r: 5, fill: C.s1 }, lg);
      const t1 = el('text', { x: 18, y: 0, fill: C.text2 }, lg, o.lblSpool);
      const off = 18 + (t1.getComputedTextLength ? t1.getComputedTextLength() : 120) + 26;
      el('line', { x1: off, x2: off + 18, y1: -fs * 0.32, y2: -fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      el('text', { x: off + 26, y: 0, fill: C.text2 }, lg, o.lblLotAvg);
      svg.setAttribute('aria-label', o.caption || '');
      const withN = o.points.length && o.points[0].n != null;
      table(host, o.caption, withN ? ['', o.lblIdx, o.lblPcs] : ['', o.lblIdx], o.points.map((p) => (withN ? [o.tipTitle(p), fmt(p.idx, 0), fmt(p.n, 0)] : [o.tipTitle(p), fmt(p.idx, 0)])));
    });
  }

  /* ---------- barra segmentada alta (um todo em partes) — HTML ----------
     o: { parts:[{label, value, color, dark?}], unit:'%', dec, caption } */
  function segbar(host, o) {
    host.textContent = ''; host.classList.add('segbar');
    const total = o.parts.reduce((s, p) => s + p.value, 0);
    const bar = h('div', 'segbar-bar', host); bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', (o.caption || '') + ': ' + o.parts.map((p) => p.label + ' ' + fmt(p.value, o.dec || 0) + (o.unit || '')).join(', '));
    o.parts.forEach((p) => {
      if (p.value <= 0) return;
      const s = h('div', 'segbar-seg', bar); s.style.flexGrow = p.value / total; s.style.flexBasis = '0'; s.style.background = p.color; s.tabIndex = 0;
      const lab = h('span', '', s, fmt(p.value, o.dec || 0) + (o.unit || '')); lab.style.color = p.dark ? '#0B1017' : '#fff';
      bindTip(s, p.label, [['', fmt(p.value, o.dec || 0) + (o.unit || ''), p.color]]);
      requestAnimationFrame(() => { if (lab.scrollWidth + 14 > s.clientWidth) lab.hidden = true; });
    });
    const lg = h('div', 'segbar-legend', host);
    o.parts.forEach((p) => { const it = h('span', '', lg); const sw = h('i', '', it); sw.style.background = p.color; h('span', '', it, p.label); });
    table(host, o.caption, ['', o.unit || ''], o.parts.map((p) => [p.label, fmt(p.value, o.dec || 0) + (o.unit || '')]));
    return { replay() { if (reduced() || !bar.animate) return; bar.animate([{ clipPath: 'inset(0 100% 0 0 round 6px)' }, { clipPath: 'inset(0 0 0 0 round 6px)' }], { duration: 900, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }); } };
  }

  /* ---------- lista de medidores (nome · barra · valor) — HTML ----------
     o: { rows:[{label, value, note?}], max, unit, dec, color, caption } */
  function meters(host, o) {
    host.textContent = ''; host.classList.add('meters');
    const max = o.max || Math.max.apply(null, o.rows.map((x) => x.value));
    const bars = [];
    o.rows.forEach((row) => {
      const r = h('div', 'meter-row', host); h('span', 'meter-name', r, row.label);
      const tr = h('span', 'meter-track', r), fl = h('i', '', tr); fl.style.width = Math.max(0, (row.value / max) * 100) + '%'; if (o.color) fl.style.background = o.color; bars.push(fl);
      h('b', 'meter-val', r, fmt(row.value, o.dec || 0) + (o.unit || ''));
      r.tabIndex = 0; bindTip(r, row.label, [[row.note || '', fmt(row.value, o.dec || 0) + (o.unit || ''), o.color || C.s1]]);
    });
    table(host, o.caption, ['', o.unit || ''], o.rows.map((x) => [x.label, fmt(x.value, o.dec || 0) + (o.unit || '')]));
    return { replay() { if (reduced()) return; bars.forEach((b, i) => b.animate && b.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 700, delay: i * 60, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' })); } };
  }

  /* ---------- dispersão por linha (cada ponto = uma pessoa/unidade anônima), índice com mediana = 100 ----------
     o: { rows:[{label, idx[]}], lo, hi, lblMedian, tipRow(label, v), caption } */
  function rowsDots(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.rows.length, step = o.step || 20;
      const narrow = w < 520, lblW = Math.min(w * (narrow ? 0.4 : 0.36), r * (o.lblW || 9.5));
      const m = { l: lblW, r: r * 0.8, t: r * 1.4, b: r * 1.6 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b, band = ph / n, lo = o.lo || 40, hi = o.hi || 140;
      const x = (v) => m.l + ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * pw;
      const g = el('g', { 'font-size': fs }, svg);
      const skip = pw / ((hi - lo) / step) < fs * 2.4 ? 2 : 1;
      for (let v = lo; v <= hi; v += step) { el('line', { x1: x(v), x2: x(v), y1: m.t, y2: m.t + ph, stroke: v === 100 ? C.axis : C.grid, 'stroke-width': v === 100 ? 1.5 : 1 }, g);
        if (skip === 1 || Math.round((v - 100) / step) % skip === 0) el('text', { x: x(v), y: m.t + ph + fs * 1.5, 'text-anchor': 'middle', fill: v === 100 ? C.text : C.text3, 'font-weight': v === 100 ? 600 : 400, style: 'font-variant-numeric: tabular-nums' }, g, String(v)); }
      el('text', { x: x(100), y: m.t - fs * 0.6, 'text-anchor': 'middle', fill: C.text2 }, g, o.lblMedian);
      const rad = o.swarm ? Math.max(3.5, Math.min(5, r * 0.26)) : 5, dia = rad * 2 + 1.5;

<script>
/* ============================================================
   Apresentação "Planejamento e controle" — motor do deck e slides
   ?lang=en|pt|ja|de · ?embed=1 (aberta dentro do app) · #n ou #id abre no slide · #k=CÓDIGO liga a visão de parceiros
   Visão de parceiros: os slides reservados ficam cifrados (AES-256-GCM) no bloco "vault" e só entram no deck
   depois de digitado o código. Nada deles existe em claro neste arquivo.

(() => {
  const D = OPS_DATA, H = Viz.h, C = Viz.C;

  let lang = q.get('lang') || '';

  if (!LANGS.includes(lang)) lang = q.get('alang') || '';

  if (!LANGS.includes(lang)) lang = 'en';
  let L = OPS_I18N[lang];
  const fill = (s, v) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v && v[k] != null ? v[k] : m));
  const F = (n, d) => Viz.fmt(n, d);
  const mobile = () => matchMedia('(max-width: 760px), (orientation: portrait) and (max-width: 1100px)').matches;
  const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = (d, vb) => `<svg viewBox="${vb || '0 0 24 24'}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const ICON = {
    prev: svg('<path d="m15 6-6 6 6 6"/>'), next: svg('<path d="m9 6 6 6-6 6"/>'), x: svg('<path d="M6 6l12 12M18 6 6 18"/>'), back: svg('<path d="M4 12h16M10 6l-6 6 6 6"/>'),
    check: svg('<path d="m5 12.5 4.5 4.5L19 7.5"/>'), lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
    unlock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-1.9"/>'), pulse: svg('<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>'),

  const txt = (s, o, extra) => { const t = H('div', 'txt', s); H('h1', '', t, o.title); H('p', 'lead', t, fill(o.lead, extra)); return t; };
  const stat = (p, v, l) => { const d = H('div', 'stat', p); H('b', '', d, v); H('span', '', d, l); return d; };

      const tl = H('div', 'tl', s); tl.setAttribute('role', 'img'); tl.setAttribute('aria-label', fill(L.cover.cap, { wk: WK }));
      H('div', 'tl-axis', tl);
      for (let w = -WK; w <= 1; w++) { const tk = H('div', 'tl-tick', tl); tk.style.left = pos(w); H('span', '', tk, w === 0 ? '0' : (w > 0 ? '+' : '−') + Math.abs(w)); }

      const bar = H('div', 'tl-bar', tl); bar.style.width = pos(0);
      const m1 = H('div', 'tl-m start', tl, L.cover.t1); m1.style.left = '0'; H('i', '', m1);

        anim(m2, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 1750 }); anim(m3, [{ opacity: 0 }, { opacity: 1 }], { duration: 500, delay: 2150 }); };

      const row = (a, b) => { const r = H('div', 'gp-row', fig), l = H('div', 'gp-l', r); H('span', '', l, a); H('b', '', l, b); return H('div', 'gp-t', r); };

      const t2 = row(g.r2, g.r2v); const b2 = H('i', 'gp-bar b2', t2); b2.style.width = pc(3); const b2r = H('i', 'gp-bar b2r', t2); b2r.style.left = pc(3); b2r.style.width = pc(2);

      const t3 = row(g.r3, g.r3v); H('i', 'gp-dot', t3); const g3 = H('i', 'gp-gap', t3); g3.style.left = '0'; g3.style.width = pc(8); H('em', '', g3, g.gapAll);
      const ax = H('div', 'gp-row gp-ax', fig); H('div', 'gp-l', ax); const at = H('div', 'gp-t', ax);
      for (let w = 0; w <= W; w++) { const k = H('span', '', at, String(w)); k.style.left = pc(w); }
      H('em', '', at, g.weeks);
      H('p', 'note', f, fill(g.note, { avg: F(D.lead.avg_week12, 0) }));
      const bars = [b1, b2, b2r], gaps = [g2, g3];
      return () => { bars.forEach((b, i) => anim(b, [{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 900, delay: 200 + i * 260 })); gaps.forEach((x, i) => anim(x, [{ opacity: 0 }, { opacity: 1 }], { duration: 600, delay: 1300 + i * 300 })); };
    } },

    { id: 'why', ch: 'market', build(s) {

      const labels = o.weeks.map(String);
      const ch = Viz.columns(v, { labels, values: o.hist, unit: '%', dec: 1, title: (i) => fill(L.why.wk, { n: labels[i] }), rowLabel: L.why.row, xTitle: L.why.x,
        marks: [{ at: o.p50, text: L.why.m50 }, { at: o.p95, text: L.why.m95 }], caption: L.why.cap, head: [L.why.x, '%'] });
      H('p', 'note', f, fill(L.why.note, { pcs: F(o.pcs), lots: F(o.lots), since: o.since }));
      return () => ch.replay();
    } },

    { id: 'market', ch: 'market', build(s) {

      const f = H('div', 'fig', s); const v = H('div', '', f);
      const mf = new Intl.DateTimeFormat(L.locale, { month: 'short', year: 'numeric' });
      const ch = Viz.longSeries(v, { idx: o.idx, roll: o.roll, first: o.first, lblMonth: L.market.month, lblRoll: L.market.roll, fmtMonth: (d) => mf.format(d), caption: L.market.cap });
      const r = H('div', 'rule', f); H('h3', '', r, L.market.ruleT); H('p', '', r, L.market.rule);
      const ul = H('ul', '', r); [[L.market.r1, L.market.r1d], [L.market.r2, L.market.r2d]].forEach(([a, b]) => { const li = H('li', '', ul); H('b', '', li, a); li.appendChild(document.createTextNode(' : ' + b)); });

    { id: 'abc', ch: 'plan', build(s) {

      const f = H('div', 'fig', s); const v = H('div', '', f);
