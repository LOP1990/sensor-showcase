# Registra, em dias úteis, a cotação de paládio, platina e ouro (EUR/g) em metais.json.
# O monitor de mercados do app (monitor.html) emenda esses registros no histórico da Sensor.
# Não usa chave nem segredo: as fontes são públicas (gold-api.com e câmbio EUR/USD).
name: metais

on:
  schedule:
    - cron: '35 21 * * 1-5'   # 18:35 em Brasília (UTC−3), de segunda a sexta
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metais
  cancel-in-progress: false

jobs:
  registrar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Gravar o registro do dia
        run: python3 scripts/metais.py metais.json
      - name: Publicar se mudou
        run: |
          git add metais.json
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git config user.name "metais-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "metais.json: $(TZ=America/Sao_Paulo date +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
