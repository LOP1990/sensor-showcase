<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
@font-face { font-family: 'Archivo'; font-style: normal; font-display: swap; font-weight: 100 900; font-stretch: 62% 125%; src: url(fonts/Archivo-var.woff2) format('woff2'); }
@font-face { font-family: 'Noto Sans JP'; font-weight: 700; font-display: swap; src: url(fonts/NotoSansJP-bold.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
@font-face { font-family: 'Noto Sans JP'; font-weight: 450; font-display: swap; src: url(fonts/NotoSansJP-text.woff2) format('woff2'); unicode-range: U+3000-30FF, U+4E00-9FFF, U+FF00-FFEF; }
/* ============================================================
   Sensor Technology · páginas de operações (planejamento, parceiros)
   Mesmos tokens do app; tudo em rem — a raiz acompanha o tamanho da tela (do celular ao painel 4K).
   ============================================================ */
:root {
  color-scheme: dark;
  --bg: #05070B; --bg-2: #0B1017; --surface: #10161F; --surface-2: #151D28;
  --line: rgba(191, 211, 230, .14); --line-2: rgba(191, 211, 230, .28);
  --text: #EFECE6; --text-2: #B3BDCA; --text-3: #8792A8;
  --plat: #BFD3E6; --plat-2: #E8F1FB; --glow: #FFD27A;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --r1: #cde2fb; --r2: #86b6ef; --r3: #3987e5; --r4: #256abf; --r5: #184f95;
  --font: 'Archivo', 'Noto Sans JP', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --ease: cubic-bezier(.2, .7, .2, 1);
}
html { font-size: clamp(13px, min(1.11vw, 1.98vh), 46px); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 1rem; line-height: 1.5; overflow: hidden; overscroll-behavior: none; }
html[lang="ja"] body { line-break: strict; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--plat); outline-offset: 3px; border-radius: 4px; }
p, h1, h2, h3, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }

/* ---------- gráficos ---------- */
.viz { position: relative; min-height: 0; }
.viz svg { display: block; width: 100%; height: 100%; overflow: visible; font-family: inherit; }
.viz svg [tabindex]:focus { outline: none; }
.viz svg [tabindex]:focus-visible { stroke: var(--plat); stroke-width: 1.5; }
.viz-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; padding: 0; margin: -1px; }
.viz-tip { position: fixed; z-index: 90; pointer-events: none; max-width: 22rem; padding: .55rem .75rem; border-radius: .5rem; background: #1B2532; border: 1px solid var(--line-2); box-shadow: 0 .6rem 1.8rem rgba(0, 0, 0, .5); font-size: .78rem; line-height: 1.35; color: var(--text-2); }
.viz-tip[hidden] { display: none; }
.viz-tip-t { color: var(--text-2); margin-bottom: .25rem; }
.viz-tip-r { display: flex; align-items: baseline; gap: .45rem; white-space: nowrap; }
.viz-tip-r b { color: var(--text); font-weight: 600; font-size: .95rem; font-variant-numeric: tabular-nums; }
.viz-key { flex: none; width: .9rem; height: 2px; border-radius: 2px; align-self: center; }

.segbar-bar { display: flex; gap: 2px; height: 1.75rem; max-height: 28px; min-height: 22px; border-radius: 6px; }
.segbar-seg { min-width: 2px; border-radius: 4px; display: flex; align-items: center; padding: 0 .5rem; overflow: visible; font-size: .8rem; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.segbar-seg span[hidden] { display: none; }
.segbar-legend { display: flex; flex-wrap: wrap; gap: .35rem 1.4rem; margin-top: .7rem; font-size: .8rem; color: var(--text-2); }
.segbar-legend > span { display: inline-flex; align-items: center; gap: .5rem; }
.segbar-legend i { width: .75rem; height: .75rem; border-radius: 2px; flex: none; }

.meters { display: grid; gap: .55rem; }
.meter-row { display: grid; grid-template-columns: minmax(8rem, 38%) 1fr auto; align-items: center; gap: .9rem; font-size: .85rem; color: var(--text-2); }
.meter-track { height: .5rem; border-radius: 99px; background: rgba(57, 135, 229, .22); overflow: hidden; }
.meter-track i { display: block; height: 100%; border-radius: 99px; background: var(--s1); transform-origin: left center; }
.meter-val { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 2.4rem; text-align: right; }

/* barras empilhadas em linhas (várias composições lado a lado, uma legenda só) */
.stackrows { display: grid; gap: .5rem; }
.stackrows .segbar-legend { margin: 0 0 .45rem; }
.stack-row { display: grid; grid-template-columns: minmax(6.5rem, 11rem) minmax(0, 1fr); gap: .9rem; align-items: center; }
.stack-lbl { display: grid; line-height: 1.2; min-width: 0; }
.stack-lbl b { font-size: .92rem; font-weight: 600; color: var(--text); }
.stack-lbl span { font-size: .78rem; color: var(--text-3); }
@media (max-width: 760px), (orientation: portrait) and (max-width: 1100px) {
  .stack-row { grid-template-columns: minmax(0, 1fr); gap: .25rem; }
  .stack-lbl { display: flex; gap: .5rem; align-items: baseline; }
}

/* ---------- peças comuns ---------- */
.stat { display: grid; gap: .1rem; }
.stat b { font-size: 2rem; line-height: 1.05; font-weight: 600; font-stretch: 105%; letter-spacing: -.01em; color: var(--text); }
.stat span { font-size: .85rem; color: var(--text-2); max-width: 17rem; }
.note { font-size: .78rem; color: var(--text-3); }
.btn { display: inline-flex; align-items: center; gap: .6rem; min-height: 2.9rem; padding: .7rem 1.35rem; border-radius: 999px; border: 1px solid var(--line-2); font-weight: 500; color: var(--text); text-decoration: none; transition: background .2s, border-color .2s; }
.btn:hover { background: rgba(191, 211, 230, .08); }
.btn:active { background: rgba(191, 211, 230, .16); }
.btn.primary { background: var(--plat); border-color: var(--plat); color: var(--bg); font-weight: 600; }
.btn.primary:hover { background: var(--plat-2); }
.btn svg { width: 1.15rem; height: 1.15rem; flex: none; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

/* ============================================================
   Área de parceiros — layout (o conteúdo vem cifrado)
   ============================================================ */
html { font-size: clamp(13px, min(1.02vw, 1.82vh), 42px); }
.pa { position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: radial-gradient(90rem 50rem at 85% -10%, rgba(57, 135, 229, .09), transparent 60%), var(--bg); }
.pa-top { display: flex; align-items: center; gap: .9rem; padding: .8rem 2.2rem .6rem; min-height: 4rem; border-bottom: 1px solid var(--line); }
.pa-top img { height: 2.4rem; width: auto; display: block; }
.pa-top .name { color: var(--text-2); font-size: .95rem; padding-left: 1.1rem; margin-left: .3rem; border-left: 1px solid var(--line-2); white-space: nowrap; }
.pa-top .sp { flex: 1; }
.pa-top .langs { display: flex; gap: .25rem; margin-right: .4rem; }
.pa-top .langs button { min-width: 2.7rem; min-height: 2.3rem; padding: .25rem .7rem; border-radius: 999px; border: 1px solid transparent; color: var(--text-3); font-size: .85rem; font-weight: 500; }
.pa-top .langs button.on { color: var(--text); border-color: var(--line-2); background: rgba(191, 211, 230, .08); }
.pa-top .x { display: inline-flex; align-items: center; gap: .5rem; min-height: 2.3rem; padding: .25rem .95rem; border-radius: 999px; border: 1px solid var(--line-2); font-size: .85rem; color: var(--text-2); text-decoration: none; white-space: nowrap; }
.pa-top .x[hidden] { display: none; }
.pa-top .x svg { width: 1rem; height: 1rem; }
.pa-body { min-height: 0; display: grid; }

/* portão */
.pa-gate { align-self: center; justify-self: center; width: min(30rem, 92vw); display: grid; gap: 1.1rem; justify-items: start; padding: 2.4rem; border: 1px solid var(--line-2); border-radius: 1rem; background: rgba(16, 22, 31, .72); }
.pa-gate[hidden] { display: none; }
.pa-gate .g-ic { width: 3rem; height: 3rem; border-radius: 50%; display: grid; place-items: center; background: rgba(191, 211, 230, .1); color: var(--plat); }
.pa-gate .g-ic svg { width: 1.4rem; height: 1.4rem; }
.pa-gate h1 { font-size: 1.9rem; font-weight: 600; font-stretch: 106%; line-height: 1.1; }
.pa-gate p { color: var(--text-2); font-size: 1rem; }
.pa-gate label { display: grid; gap: .45rem; width: 100%; font-size: .85rem; color: var(--text-2); }
.pa-gate input { width: 100%; font: inherit; font-size: 1.35rem; font-weight: 600; letter-spacing: .08em; font-variant-numeric: tabular-nums; color: var(--text); background: var(--bg); border: 1px solid var(--line-2); border-radius: .6rem; padding: .85rem 1rem; min-height: 3.4rem; text-transform: uppercase; }
.pa-gate input::placeholder { color: #4B566A; letter-spacing: .08em; }
.pa-gate input:focus { outline: 2px solid var(--plat); outline-offset: 2px; }
.pa-gate .btn { min-width: 8rem; justify-content: center; font-size: 1.05rem; }
.pa-gate.busy .btn { opacity: .6; }
.pa-gate .g-msg { min-height: 1.5em; font-size: .92rem; color: var(--glow); }

/* conteúdo */
.pa-wrap { display: grid; grid-template-columns: 17rem minmax(0, 1fr); min-height: 0; }
.pa-wrap[hidden] { display: none; }
.pa-side { padding: 1.8rem 1.2rem 1.4rem 2.2rem; border-right: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; gap: 1rem; min-height: 0; overflow: auto; }
.pa-side h2 { font-size: .85rem; font-weight: 500; color: var(--text-3); }
.pa-side nav { display: grid; align-content: start; gap: .15rem; }
.pa-side nav button { text-align: left; padding: .6rem .8rem; border-left: 2px solid transparent; font-size: .95rem; color: var(--text-2); line-height: 1.3; }
.pa-side nav button.on { color: var(--text); border-left-color: var(--plat); background: linear-gradient(90deg, rgba(191, 211, 230, .09), transparent 85%); }
.pa-conf { font-size: .78rem; color: var(--text-3); }
.pa-main { overflow: auto; min-height: 0; padding: 2.2rem 3rem 5rem; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.pa-head { max-width: 62rem; margin-bottom: 2.6rem; }
.pa-head h1 { font-size: 2.7rem; line-height: 1.08; font-weight: 600; font-stretch: 108%; letter-spacing: -.015em; }
.pa-sub { margin-top: .8rem; color: var(--text-2); font-size: 1rem; }
.pa-sec { padding: 2.4rem 0 2.6rem; border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.3rem; max-width: 78rem; scroll-margin-top: 1rem; }
.pa-sec > h2 { font-size: 1.75rem; font-weight: 600; font-stretch: 106%; line-height: 1.15; }
.pa-lead { font-size: 1.12rem; color: var(--text-2); max-width: 44em; }
.pa-sec p { max-width: 50em; color: var(--text-2); }
.pa-list { display: grid; gap: .55rem; max-width: 52em; }
.pa-list li { position: relative; padding-left: 1.2rem; color: var(--text-2); }
.pa-list li::before { content: ''; position: absolute; left: 0; top: .62em; width: .4rem; height: .4rem; border-radius: 50%; background: var(--plat); opacity: .8; }
.pa-map { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr) minmax(0, 1fr); gap: 0; border: 1px solid var(--line-2); border-radius: .8rem; overflow: hidden; }
.pa-col { padding: 1.3rem 1.4rem; display: grid; align-content: start; gap: .9rem; border-left: 1px solid var(--line-2); }
.pa-col:first-child { border-left: 0; }
.pa-col.wide { background: rgba(16, 22, 31, .75); }
.pa-col h3 { font-size: .85rem; font-weight: 500; color: var(--text-3); }
.pa-col .pa-list li { font-size: .95rem; }
.pa-col dl { display: grid; gap: .85rem; margin: 0; }
.pa-col dt { font-weight: 600; color: var(--text); font-size: 1.02rem; }
.pa-col dd { margin: .15rem 0 0; font-size: .9rem; color: var(--text-2); }
.pa-keys { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .7rem; font-size: .9rem; }
.pa-keys b { font-weight: 500; color: var(--text-3); margin-right: .3rem; }
.pa-keys span { padding: .35rem .85rem; border: 1px solid var(--line-2); border-radius: 999px; color: var(--text); }
.pa-chain { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1.4rem 1.6rem; counter-reset: ch; }
.pa-chain li { counter-increment: ch; position: relative; padding: .9rem 0 0 2.9rem; border-top: 2px solid var(--s1); display: grid; gap: .2rem; align-content: start; }
.pa-chain li::before { content: counter(ch); position: absolute; left: 0; top: .75rem; font-size: 1.7rem; line-height: 1; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.pa-chain li b { font-weight: 600; font-size: 1.05rem; }
.pa-chain li span { font-size: .88rem; color: var(--text-2); }
.pa-badges { display: flex; flex-wrap: wrap; gap: .5rem .7rem; }
.pa-badges li { font-size: .88rem; color: var(--text-2); padding: .4rem .85rem; border-radius: .45rem; background: rgba(191, 211, 230, .07); }
.pa-rules { display: grid; grid-template-columns: minmax(9rem, 14rem) minmax(0, 1fr); gap: .9rem 1.8rem; margin: 0; max-width: 64rem; }
.pa-rules dt { font-weight: 600; color: var(--text); }
.pa-rules dd { margin: 0; color: var(--text-2); }
.pa-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2.2rem 2.6rem; align-items: start; }
.pa-sec figure { display: grid; gap: .8rem; min-width: 0; }
.pa-sec figcaption { font-size: .95rem; font-weight: 600; color: var(--text); }
.pa-viz { height: 17rem; }
.pa-viz.tall { height: 21rem; }
.pa-note { font-size: .82rem; color: var(--text-3); }
.pa-table { border-collapse: collapse; width: 100%; font-size: .92rem; font-variant-numeric: tabular-nums; }
.pa-table th { text-align: right; font-weight: 500; color: var(--text-3); font-size: .8rem; padding: .4rem .7rem; border-bottom: 1px solid var(--line-2); vertical-align: bottom; }
.pa-table td { text-align: right; padding: .5rem .7rem; border-bottom: 1px solid var(--line); color: var(--text); }
.pa-table th:first-child, .pa-table td:first-child { text-align: left; color: var(--text-2); }
.pa-formula { font-size: 1.02rem; color: var(--text) !important; padding: .9rem 1.1rem; border-left: 2px solid var(--plat); background: rgba(191, 211, 230, .05); border-radius: 0 .5rem .5rem 0; }
.pa-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1.4rem 2rem; padding: 1.2rem 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

@media (max-width: 900px), (orientation: portrait) and (max-width: 1100px) {
  html { font-size: 16px; }
  body { overflow: auto; }
  .pa { position: static; display: block; }
  .pa-top { position: static; padding: .6rem 1rem; flex-wrap: wrap; gap: .5rem; }
  .pa-top .name { display: none; }
  .pa-gate { margin: 3rem auto; padding: 1.6rem; }
  .pa-wrap { display: block; }
  .pa-side { position: sticky; top: 0; z-index: 4; background: rgba(5, 7, 11, .96); border-right: 0; border-bottom: 1px solid var(--line); padding: .5rem 1rem; display: block; overflow: visible; }
  .pa-side h2, .pa-conf { display: none; }
  .pa-side nav { display: flex; gap: .3rem; overflow-x: auto; scrollbar-width: none; }
  .pa-side nav button { white-space: nowrap; border-left: 0; border: 1px solid var(--line); border-radius: 999px; padding: .35rem .8rem; font-size: .85rem; }
  .pa-side nav button.on { border-color: var(--plat); background: rgba(191, 211, 230, .12); }
  .pa-main { overflow: visible; overflow-x: clip; padding: 1.6rem 1.1rem 4rem; min-width: 0; }
  .pa-wrap, .pa-body { min-width: 0; }
  .pa-body { display: block; }
  .pa-head h1 { font-size: 1.9rem; }
  .pa-sec { scroll-margin-top: 4rem; }
  .pa-viz, .pa-viz.tall { height: 16rem; }
  .pa-viz.grid4 { height: 27rem; }
  .pa-map, .pa-two, .pa-chain, .pa-stats { grid-template-columns: minmax(0, 1fr); }
  .pa-col { border-left: 0; border-top: 1px solid var(--line-2); }
  .pa-col:first-child { border-top: 0; }
  .pa-rules { grid-template-columns: minmax(0, 1fr); gap: .2rem; }
  .pa-rules dd { margin-bottom: .8rem; }
  .pa-table { font-size: .8rem; display: block; overflow-x: auto; max-width: 100%; }
  .pa-table th, .pa-table td { padding: .4rem .35rem; }
}

/* subtítulo dentro de uma seção e ajustes das seções novas (rendimento por classe, custo gerencial) */
.pa-h3 { margin: 1.4rem 0 0; padding-top: 1.6rem; border-top: 1px solid var(--line); font-size: 1.3rem; font-weight: 600; color: var(--text); }
.pa-sec figure .pa-table { margin-top: .4rem; }

</style>
</head>

<script>
/* ============================================================
   Sensor Technology · gráficos (SVG puro, sem bibliotecas)
   Regras: marcas finas, eixo único, grade em fio contínuo, texto sempre nas cores de texto,
   dica (tooltip) em todos os gráficos, tabela equivalente para leitores de tela.
   ============================================================ */
const Viz = (() => {
  const NS = 'http://www.w3.org/2000/svg';
  const C = {
    s1: '#3987e5', s2: '#d95926', s3: '#199e70', s4: '#c98500',
    ramp: ['#cde2fb', '#86b6ef', '#3987e5', '#256abf', '#184f95'],
    mute: '#3a4658', grid: 'rgba(191,211,230,.13)', axis: 'rgba(191,211,230,.30)',
    text: '#EFECE6', text2: '#B3BDCA', text3: '#8792A8', surface: '#05070B', glow: '#FFD27A',
    good: '#0ca30c', warn: '#fab219', bad: '#d03b3b',
  };
  let LOCALE = 'en-US';
  const setLocale = (l) => { LOCALE = l; };
  const nf = (d) => new Intl.NumberFormat(LOCALE, { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 });
  const fmt = (v, d) => nf(d).format(v);
  const rem = () => parseFloat(getComputedStyle(document.documentElement).fontSize) || 16;
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(name, attrs, parent, text) {
    const n = document.createElementNS(NS, name);
    if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }
  function h(tag, cls, parent, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    if (parent) parent.appendChild(n);
    return n;
  }

  /* ---------- dica (uma só para a página) ---------- */
  let tip;
  function tipEl() {
    if (!tip) { tip = h('div', 'viz-tip', document.body); tip.setAttribute('role', 'status'); tip.hidden = true; }
    return tip;
  }
  // rows: [[rótulo, valor, cor?]]; title opcional. Tudo via textContent.
  function showTip(x, y, title, rows) {
    const t = tipEl(); t.textContent = '';
    if (title) h('div', 'viz-tip-t', t, title);
    (rows || []).forEach(([label, value, color]) => {
      const r = h('div', 'viz-tip-r', t);
      if (color) { const k = h('i', 'viz-key', r); k.style.background = color; }
      h('b', '', r, value); h('span', '', r, label);
    });
    t.hidden = false;
    const z = (parseFloat(document.documentElement.style.zoom) || 1);
    const vw = window.innerWidth / z, vh = window.innerHeight / z;
    const w = t.offsetWidth, hh = t.offsetHeight, pad = 12;
    let left = x / z + 14, top = y / z - hh - 12;
    if (left + w + pad > vw) left = x / z - w - 14;
    if (left < pad) left = pad;
    if (top < pad) top = y / z + 18;
    if (top + hh + pad > vh) top = vh - hh - pad;
    t.style.left = left + 'px'; t.style.top = top + 'px';
  }
  function hideTip() { if (tip) tip.hidden = true; }
  // liga a dica a um elemento (mouse, toque e foco)
  function bindTip(node, title, rows) {
    const on = (e) => { const p = e.touches ? e.touches[0] : e; let x = p.clientX, y = p.clientY; if (x == null) { const b = node.getBoundingClientRect(); x = b.left + b.width / 2; y = b.top; } showTip(x, y, typeof title === 'function' ? title() : title, typeof rows === 'function' ? rows() : rows); };
    node.addEventListener('pointerenter', on); node.addEventListener('pointermove', on);
    node.addEventListener('pointerleave', hideTip); node.addEventListener('focus', on); node.addEventListener('blur', hideTip);
    node.addEventListener('pointerdown', on);
  }
  document.addEventListener('scroll', hideTip, true);

  /* ---------- tabela equivalente (leitor de tela) ---------- */
  function table(host, caption, head, rows) {
    const t = h('table', '', h('div', 'viz-sr', host)); // a tabela vai dentro de um bloco recortado (tabela não respeita width/overflow)
    h('caption', '', t, caption || '');
    const tr = h('tr', '', h('thead', '', t)); head.forEach((x) => h('th', '', tr, x));
    const tb = h('tbody', '', t);
    rows.forEach((r) => { const rr = h('tr', '', tb); r.forEach((x) => h('td', '', rr, String(x))); });
  }

  /* ---------- base: mede o contêiner, cria o SVG e redesenha no resize ---------- */
  function mount(host, draw) {
    host.classList.add('viz');
    let raf = 0, last = '';
    const render = (animate) => {
      const w = host.clientWidth, hgt = host.clientHeight;
      if (w < 40 || hgt < 40) return;
      const key = w + 'x' + hgt + '@' + rem() + LOCALE;
      if (!animate && key === last) return;
      last = key;
      host.textContent = '';
      const svg = el('svg', { viewBox: `0 0 ${w} ${hgt}`, width: w, height: hgt, role: 'img' }, host);
      draw({ svg, w, h: hgt, r: rem(), animate: !!animate && !reduced(), host });
    };
    if (window.ResizeObserver) new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(false)); }).observe(host);
    host._render = render;
    render(false);
    return { render, replay: () => render(true) };
  }
  const ticks = (max, n) => {
    const raw = max / (n || 4), p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
    const step = (m <= 1 ? 1 : m <= 2 ? 2 : m <= 2.5 ? 2.5 : m <= 5 ? 5 : 10) * p; const out = [];
    for (let v = 0; v <= max + 1e-9; v += step) out.push(+v.toFixed(6));
    return out;
  };
  function grow(node, attr, from, to, ms, delay) {
    if (!node.animate) { node.setAttribute(attr, to); return; }
    const a = el('animate', { attributeName: attr, from, to, dur: (ms || 700) + 'ms', begin: 'indefinite', fill: 'freeze', calcMode: 'spline', keySplines: '.2 .7 .2 1', keyTimes: '0;1' }, node);
    node.setAttribute(attr, from);
    setTimeout(() => { try { a.beginElement(); } catch (e) { node.setAttribute(attr, to); } }, delay || 0);
    setTimeout(() => node.setAttribute(attr, to), (delay || 0) + (ms || 700) + 60);
  }
  function fadeIn(node, ms, delay) {
    if (!node.animate) return;
    node.animate([{ opacity: 0 }, { opacity: 1 }], { duration: ms || 500, delay: delay || 0, fill: 'both', easing: 'ease-out' });
  }

  /* ---------- colunas (histograma / séries curtas) ----------
     o: { labels[], values[], unit:'%', dec, title(i)→str, rowLabel, xTitle, yMax, color, colors[i], marks:[{at, text}], labelEvery, valueLabels:'all'|[i…]|null,
          caption, head:[x,y] } */
  function columns(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.values.length;
      const m = { l: r * 2.4, r: r * 0.6, t: r * (o.marks ? 2.2 : 1.2), b: r * (o.xTitle ? 2.9 : 1.8) };
      const pw = w - m.l - m.r, ph = H - m.t - m.b;
      const max = o.yMax || Math.max.apply(null, o.values) * 1.12;
      const tk = ticks(max, 4), top = Math.max(max, tk[tk.length - 1]);
      const y = (v) => m.t + ph - (v / top) * ph, band = pw / n, bw = Math.min(24 * (r / 16), band - 2, band * 0.72);
      const g = el('g', { 'font-size': fs, 'font-family': 'inherit' }, svg);
      tk.forEach((v) => {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? C.axis : C.grid, 'stroke-width': 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, fmt(v, 0) + (o.unit || ''));
      });
      const every = o.labelEvery || (band < fs * 2.2 ? Math.ceil(fs * 2.2 / band) : 1);
      o.values.forEach((v, i) => {
        const x = m.l + band * i + (band - bw) / 2, yy = y(v), hh = Math.max(0, m.t + ph - yy), rad = Math.min(4, bw / 2, hh);
        const col = (o.colors && o.colors[i]) || o.color || C.s1;
        const path = (top_) => `M${x},${m.t + ph}V${top_ + rad}q0,-${rad} ${rad},-${rad}h${bw - 2 * rad}q${rad},0 ${rad},${rad}V${m.t + ph}Z`;
        const p = el('path', { d: path(yy), fill: col }, g);
        if (animate && hh > 1 && p.animate) { p.style.transformBox = 'fill-box'; p.style.transformOrigin = '50% 100%';

  /* ---------- curva ABC: barras (participação) + linha (acumulado), um eixo só (%) ----------
     o: { shares[], A, B, zone:{A,B,C}, tipItem(i), lblShare, lblCum, caption } */
  function pareto(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.shares.length;
      const m = { l: r * 2.6, r: r * 0.8, t: r * 1.9, b: r * 1.4 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b, band = pw / n, bw = Math.max(2, Math.min(24, band - 2));
      const y = (v) => m.t + ph - (v / 100) * ph, xC = (i) => m.l + band * i + band / 2;
      const g = el('g', { 'font-size': fs }, svg);
      const zones = [[0, o.A, o.zone.A, 'rgba(57,135,229,.13)'], [o.A, o.A + o.B, o.zone.B, 'rgba(57,135,229,.065)'], [o.A + o.B, n, o.zone.C, 'transparent']];
      zones.forEach(([a, b, label, fill]) => {
        el('rect', { x: m.l + band * a, y: m.t, width: band * (b - a), height: ph, fill }, g);
        el('text', { x: m.l + band * a + r * 0.4, y: m.t - r * 0.55, fill: C.text2, 'font-weight': 600 }, g, label);
        if (a > 0) el('line', { x1: m.l + band * a, x2: m.l + band * a, y1: m.t - r * 1.2, y2: m.t + ph, stroke: C.axis, 'stroke-width': 1 }, g);
      });
      [0, 25, 50, 75, 100].forEach((v) => {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 0 ? C.axis : C.grid, 'stroke-width': 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, v + '%');
      });
      let cum = 0; const pts = [];
      o.shares.forEach((v, i) => {
        cum += v; pts.push([xC(i), y(Math.min(100, cum))]);
        const x = m.l + band * i + (band - bw) / 2, yy = y(v), hh = m.t + ph - yy, rad = Math.min(4, bw / 2, hh);
        const d = hh < 0.6 ? `M${x},${m.t + ph - 1}h${bw}v1h-${bw}Z` : `M${x},${m.t + ph}V${yy + rad}q0,-${rad} ${rad},-${rad}h${bw - 2 * rad}q${rad},0 ${rad},${rad}V${m.t + ph}Z`;
        const p = el('path', { d, fill: C.s1 }, g);

        bindTip(hit, o.tipItem(i), [[o.lblShare, fmt(v, 1) + '%', C.s1], [o.lblCum, fmt(c, 1) + '%', C.text]]);
      });
      const line = el('path', { d: 'M' + pts.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: C.text, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
      if (animate && line.getTotalLength) { const L = line.getTotalLength(); line.style.strokeDasharray = L; line.animate && line.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1100, delay: 350, easing: 'ease-out', fill: 'both' }).finished.then(() => { line.style.strokeDasharray = ''; }).catch(() => {}); }
      // marcadores nos cortes A e B, com rótulo direto
      [[o.A - 1, o.cumA], [o.A + o.B - 1, o.cumB]].forEach(([i, v], k) => {
        const [px, py] = pts[i];
        el('circle', { cx: px, cy: py, r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2 }, g);
        const t = el('text', { x: px + 10, y: py + fs * 1.25, fill: C.text, 'font-weight': 600, style: 'font-variant-numeric: tabular-nums' }, g, fmt(v, 0) + '%');
        if (animate) fadeIn(t, 400, 900 + k * 200);
      });
      // legenda (2 séries)
      const lg = el('g', { transform: `translate(${w - m.r}, ${m.t + ph * 0.56})` }, g);
      const l1 = el('text', { x: 0, y: 0, 'text-anchor': 'end', fill: C.text2 }, lg, o.lblCum);
      el('line', { x1: -(l1.getComputedTextLength ? l1.getComputedTextLength() : 120) - 26, x2: -(l1.getComputedTextLength ? l1.getComputedTextLength() : 120) - 8, y1: -fs * 0.32, y2: -fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      const l2 = el('text', { x: 0, y: fs * 1.6, 'text-anchor': 'end', fill: C.text2 }, lg, o.lblShare);
      el('rect', { x: -(l2.getComputedTextLength ? l2.getComputedTextLength() : 120) - 22, y: fs * 1.6 - fs * 0.78, width: 12, height: fs * 0.8, rx: 2, fill: C.s1 }, lg);
      svg.setAttribute('aria-label', o.caption || '');
      let c2 = 0; table(host, o.caption, ['#', o.lblShare, o.lblCum], o.shares.map((v, i) => { c2 += v; return [i + 1, fmt(v, 2) + '%', fmt(Math.min(100, c2), 1) + '%']; }));
    });
  }

  /* ---------- série mensal longa: área (mensal) + linha (média móvel de 12 meses), um eixo (índice) ----------
     o: { idx[], roll[], first:'YYYY-MM', lblMonth, lblRoll, fmtMonth(date)→str, caption } */
  function longSeries(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.idx.length;
      const narrow = w < 560;
      const m = { l: r * 0.4, r: r * 0.4, t: r * (narrow ? 3.1 : 1.6), b: r * 1.7 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b;
      const x = (i) => m.l + (i / (n - 1)) * pw, y = (v) => m.t + ph - (v / 105) * ph;
      const [y0, m0] = o.first.split('-').map(Number);
      const g = el('g', { 'font-size': fs }, svg);
      el('line', { x1: m.l, x2: w - m.r, y1: y(0), y2: y(0), stroke: C.axis, 'stroke-width': 1 }, g);
      for (let i = 0; i < n; i++) { const mo = (m0 - 1 + i) % 12, yr = y0 + Math.floor((m0 - 1 + i) / 12);
        if (mo === 0 && (yr % 2 === 1 || pw / (n / 12) > fs * 3.2)) { el('line', { x1: x(i), x2: x(i), y1: m.t, y2: y(0), stroke: C.grid, 'stroke-width': 1 }, g); el('text', { x: x(i) + 4, y: y(0) + fs * 1.45, fill: C.text3, style: 'font-variant-numeric: tabular-nums' }, g, String(yr)); } }
      const area = 'M' + o.idx.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L') + `L${x(n - 1)},${y(0)}L${x(0)},${y(0)}Z`;
      const a = el('path', { d: area, fill: C.s1, opacity: .16 }, g);
      const thin = el('path', { d: 'M' + o.idx.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join('L'), fill: 'none', stroke: C.s1, 'stroke-width': 1, opacity: .55, 'stroke-linejoin': 'round' }, g);
      const rp = o.roll.map((v, i) => v == null ? null : [x(i), y(v)]).filter(Boolean);
      const line = el('path', { d: 'M' + rp.map((p) => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('L'), fill: 'none', stroke: C.text, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g);
      if (animate) { fadeIn(a, 700, 100); fadeIn(thin, 700, 100); if (line.getTotalLength && line.animate) { const L = line.getTotalLength(); line.style.strokeDasharray = L; line.animate([{ strokeDashoffset: L }, { strokeDashoffset: 0 }], { duration: 1500, delay: 300, easing: 'ease-out', fill: 'both' }).finished.then(() => { line.style.strokeDasharray = ''; }).catch(() => {}); } }
      const last = rp[rp.length - 1]; el('circle', { cx: last[0], cy: last[1], r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2 }, g);
      // legenda no alto
      const lg = el('g', { transform: `translate(${m.l}, ${m.t - r * 0.7})` }, g);
      const y1 = narrow ? -fs * 1.55 : 0;
      el('line', { x1: 0, x2: 18, y1: y1 - fs * 0.32, y2: y1 - fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      const t1 = el('text', { x: 26, y: y1, fill: C.text2 }, lg, o.lblRoll);
      const off = narrow ? 0 : 26 + (t1.getComputedTextLength ? t1.getComputedTextLength() : 160) + 28;
      el('rect', { x: off + (narrow ? 3 : 0), y: -fs * 0.78, width: 12, height: fs * 0.8, rx: 2, fill: C.s1, opacity: .5 }, lg);
      el('text', { x: off + (narrow ? 26 : 20), y: 0, fill: C.text2 }, lg, o.lblMonth);
      // mira + dica
      const cross = el('line', { y1: m.t, y2: y(0), stroke: C.axis, 'stroke-width': 1, visibility: 'hidden' }, g);
      const dot = el('circle', { r: 5, fill: C.text, stroke: C.surface, 'stroke-width': 2, visibility: 'hidden' }, g);
      const hit = el('rect', { x: m.l, y: m.t, width: pw, height: ph, fill: 'transparent', tabindex: 0, 'aria-label': o.caption || '' }, g);
      const move = (e) => { const b = svg.getBoundingClientRect(); const px = ((e.clientX - b.left) / b.width) * w; const i = Math.max(0, Math.min(n - 1, Math.round(((px - m.l) / pw) * (n - 1))));
        cross.setAttribute('x1', x(i)); cross.setAttribute('x2', x(i)); cross.setAttribute('visibility', 'visible');
        if (o.roll[i] != null) { dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(o.roll[i])); dot.setAttribute('visibility', 'visible'); } else dot.setAttribute('visibility', 'hidden');
        const d = new Date(y0, m0 - 1 + i, 1);
        showTip(e.clientX, e.clientY, o.fmtMonth(d), [[o.lblRoll, o.roll[i] == null ? '–' : fmt(o.roll[i], 0), C.text], [o.lblMonth, fmt(o.idx[i], 0), C.s1]]); };
      hit.addEventListener('pointermove', move); hit.addEventListener('pointerdown', move);
      hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip(); });
      svg.setAttribute('aria-label', o.caption || '');
      const rows = []; for (let i = 11; i < n; i += 12) { const d = new Date(y0, m0 - 1 + i, 1); rows.push([o.fmtMonth(d), fmt(o.idx[i], 0), o.roll[i] == null ? '–' : fmt(o.roll[i], 0)]); }
      table(host, o.caption, ['', o.lblMonth, o.lblRoll], rows);
    });
  }

  /* ---------- pontos por grupo (carretéis por lote), eixo único (índice, 100 = média) ----------
     o: { points:[{lot, sp, idx, n}], lots:[{lot, idx, n}], lblLot(l), tipTitle(p), lblIdx, lblPcs, lblAvg, lblLotAvg, yMin, yMax, caption } */
  function strip(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), lots = o.lots.map((l) => l.lot), n = lots.length;

      const lo = o.yMin || 70, hi = o.yMax || 125, y = (v) => m.t + ph - ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * ph;
      const g = el('g', { 'font-size': fs }, svg);
      for (let v = Math.ceil(lo / 10) * 10; v <= hi; v += 10) {
        el('line', { x1: m.l, x2: w - m.r, y1: y(v), y2: y(v), stroke: v === 100 ? C.axis : C.grid, 'stroke-width': v === 100 ? 1.5 : 1 }, g);
        el('text', { x: m.l - r * 0.4, y: y(v) + fs * 0.35, 'text-anchor': 'end', fill: v === 100 ? C.text : C.text3, 'font-weight': v === 100 ? 600 : 400, style: 'font-variant-numeric: tabular-nums' }, g, String(v));
      }
      const maxN = Math.max.apply(null, o.points.map((p) => p.n || 1));
      lots.forEach((lot, li) => {
        const cx = m.l + band * li + band / 2;
        if (li > 0) el('line', { x1: m.l + band * li, x2: m.l + band * li, y1: m.t, y2: m.t + ph, stroke: C.grid, 'stroke-width': 1 }, g);
        el('text', { x: cx, y: m.t + ph + fs * 1.6, 'text-anchor': 'middle', fill: C.text3 }, g, o.lblLot(lot));
        const L = o.lots[li];
        const tick = el('line', { x1: cx - band * 0.34, x2: cx + band * 0.34, y1: y(L.idx), y2: y(L.idx), stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, g);
        if (animate) fadeIn(tick, 400, 700 + li * 60);
        const ps = o.points.filter((p) => p.lot === lot);
        ps.forEach((p, k) => {
          const off = ps.length > 1 ? ((k / (ps.length - 1)) - 0.5) * band * 0.56 : 0;
          const rad = p.sz ? [5, 5, 7, 9][p.sz] : Math.max(4, Math.min(9, 4 + 5 * Math.sqrt(p.n / maxN)));
          const c = el('circle', { cx: cx + off, cy: y(p.idx), r: rad, fill: C.s1, stroke: C.surface, 'stroke-width': 2, tabindex: 0, 'aria-label': o.tipTitle(p) + ': ' + fmt(p.idx, 0) }, g);
          if (animate && c.animate) c.animate([{ opacity: 0, transform: 'translateY(-14px)' }, { opacity: 1, transform: 'none' }], { duration: 450, delay: 150 + li * 60 + k * 30, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' });
          const hit = el('circle', { cx: cx + off, cy: y(p.idx), r: 14, fill: 'transparent' }, g);
          const rows = [[o.lblIdx, fmt(p.idx, 0), C.s1]].concat(p.n != null ? [[o.lblPcs, fmt(p.n, 0)]] : [], [[o.lblLotAvg, fmt(L.idx, 0), C.text]]);
          bindTip(hit, o.tipTitle(p), rows); bindTip(c, o.tipTitle(p), rows);
        });
      });
      // legenda
      const lg = el('g', { transform: `translate(${m.l + r * 0.4}, ${m.t - r * 0.55})` }, g);
      el('circle', { cx: 6, cy: -fs * 0.32, r: 5, fill: C.s1 }, lg);
      const t1 = el('text', { x: 18, y: 0, fill: C.text2 }, lg, o.lblSpool);
      const off = 18 + (t1.getComputedTextLength ? t1.getComputedTextLength() : 120) + 26;
      el('line', { x1: off, x2: off + 18, y1: -fs * 0.32, y2: -fs * 0.32, stroke: C.text, 'stroke-width': 2, 'stroke-linecap': 'round' }, lg);
      el('text', { x: off + 26, y: 0, fill: C.text2 }, lg, o.lblLotAvg);
      svg.setAttribute('aria-label', o.caption || '');
      const withN = o.points.length && o.points[0].n != null;
      table(host, o.caption, withN ? ['', o.lblIdx, o.lblPcs] : ['', o.lblIdx], o.points.map((p) => (withN ? [o.tipTitle(p), fmt(p.idx, 0), fmt(p.n, 0)] : [o.tipTitle(p), fmt(p.idx, 0)])));
    });
  }

  /* ---------- barra segmentada alta (um todo em partes) — HTML ----------
     o: { parts:[{label, value, color, dark?}], unit:'%', dec, caption } */
  function segbar(host, o) {
    host.textContent = ''; host.classList.add('segbar');
    const total = o.parts.reduce((s, p) => s + p.value, 0);
    const bar = h('div', 'segbar-bar', host); bar.setAttribute('role', 'img'); bar.setAttribute('aria-label', (o.caption || '') + ': ' + o.parts.map((p) => p.label + ' ' + fmt(p.value, o.dec || 0) + (o.unit || '')).join(', '));
    o.parts.forEach((p) => {
      if (p.value <= 0) return;
      const s = h('div', 'segbar-seg', bar); s.style.flexGrow = p.value / total; s.style.flexBasis = '0'; s.style.background = p.color; s.tabIndex = 0;
      const lab = h('span', '', s, fmt(p.value, o.dec || 0) + (o.unit || '')); lab.style.color = p.dark ? '#0B1017' : '#fff';
      bindTip(s, p.label, [['', fmt(p.value, o.dec || 0) + (o.unit || ''), p.color]]);
      requestAnimationFrame(() => { if (lab.scrollWidth + 14 > s.clientWidth) lab.hidden = true; });
    });
    const lg = h('div', 'segbar-legend', host);
    o.parts.forEach((p) => { const it = h('span', '', lg); const sw = h('i', '', it); sw.style.background = p.color; h('span', '', it, p.label); });
    table(host, o.caption, ['', o.unit || ''], o.parts.map((p) => [p.label, fmt(p.value, o.dec || 0) + (o.unit || '')]));
    return { replay() { if (reduced() || !bar.animate) return; bar.animate([{ clipPath: 'inset(0 100% 0 0 round 6px)' }, { clipPath: 'inset(0 0 0 0 round 6px)' }], { duration: 900, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' }); } };
  }

  /* ---------- lista de medidores (nome · barra · valor) — HTML ----------
     o: { rows:[{label, value, note?}], max, unit, dec, color, caption } */
  function meters(host, o) {
    host.textContent = ''; host.classList.add('meters');
    const max = o.max || Math.max.apply(null, o.rows.map((x) => x.value));
    const bars = [];
    o.rows.forEach((row) => {
      const r = h('div', 'meter-row', host); h('span', 'meter-name', r, row.label);
      const tr = h('span', 'meter-track', r), fl = h('i', '', tr); fl.style.width = Math.max(0, (row.value / max) * 100) + '%'; if (o.color) fl.style.background = o.color; bars.push(fl);
      h('b', 'meter-val', r, fmt(row.value, o.dec || 0) + (o.unit || ''));
      r.tabIndex = 0; bindTip(r, row.label, [[row.note || '', fmt(row.value, o.dec || 0) + (o.unit || ''), o.color || C.s1]]);
    });
    table(host, o.caption, ['', o.unit || ''], o.rows.map((x) => [x.label, fmt(x.value, o.dec || 0) + (o.unit || '')]));
    return { replay() { if (reduced()) return; bars.forEach((b, i) => b.animate && b.animate([{ transform: 'scaleX(0)' }, { transform: 'none' }], { duration: 700, delay: i * 60, easing: 'cubic-bezier(.2,.7,.2,1)', fill: 'both' })); } };
  }

  /* ---------- dispersão por linha (cada ponto = uma pessoa/unidade anônima), índice com mediana = 100 ----------
     o: { rows:[{label, idx[]}], lo, hi, lblMedian, tipRow(label, v), caption } */
  function rowsDots(host, o) {
    return mount(host, ({ svg, w, h: H, r, animate }) => {
      const fs = Math.max(11, r * 0.7), n = o.rows.length, step = o.step || 20;
      const narrow = w < 520, lblW = Math.min(w * (narrow ? 0.4 : 0.36), r * (o.lblW || 9.5));
      const m = { l: lblW, r: r * 0.8, t: r * 1.4, b: r * 1.6 };
      const pw = w - m.l - m.r, ph = H - m.t - m.b, band = ph / n, lo = o.lo || 40, hi = o.hi || 140;
      const x = (v) => m.l + ((Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo)) * pw;
      const g = el('g', { 'font-size': fs }, svg);

  /* ---------- séries anuais (poucas linhas, rótulo direto no fim, eixo único) ----------

<script>
/* ============================================================
   Área de parceiros — casca pública: pede o código, decifra o conteúdo (AES-256-GCM, chave por PBKDF2-SHA256)
   e só então monta a página. Nada do conteúdo existe em claro neste arquivo.
   ?lang=en|pt|ja|de · ?embed=1 · #k=CÓDIGO abre direto (o código sai da barra de endereço em seguida)
   Depois de aberto, o código fica só na sessão do navegador (a mesma chave usada pela apresentação): some ao fechar

(() => {
  const H = Viz.h, q = new URLSearchParams(location.search), EMBED = q.get('embed') === '1';
  const LANGS = ['en', 'pt', 'ja', 'de'];

  if (!LANGS.includes(lang)) lang = (navigator.language || 'en').slice(0, 2).toLowerCase();
  if (!LANGS.includes(lang)) lang = 'en';
  const T = {
    en: { area: 'Partner area', intro: 'Enter the access code you received from Sensor Technology.', ph: 'ST-XXXX-XXXX-XXXX', go: 'Open', busy: 'Checking the code', bad: 'This code does not open the area. Check it and try again.', nosec: 'This browser cannot open the protected area. Use a current browser over HTTPS.', lock: 'Lock', deck: 'Presentation', close: 'Close', back: 'Showcase', code: 'Access code', conf: 'Confidential. Please do not forward.' },
    pt: { area: 'Área de parceiros', intro: 'Digite o código de acesso que você recebeu da Sensor Technology.', ph: 'ST-XXXX-XXXX-XXXX', go: 'Abrir', busy: 'Conferindo o código', bad: 'Este código não abre a área. Confira e tente de novo.', nosec: 'Este navegador não consegue abrir a área protegida. Use um navegador atual, em HTTPS.', lock: 'Bloquear', deck: 'Apresentação', close: 'Fechar', back: 'Showcase', code: 'Código de acesso', conf: 'Confidencial. Por favor, não encaminhe.' },
    ja: { area: 'パートナーエリア', intro: 'センサー・テクノロジーからお知らせしたアクセスコードを入力してください。', ph: 'ST-XXXX-XXXX-XXXX', go: '開く', busy: 'コードを確認しています', bad: 'このコードでは開けません。ご確認のうえ、もう一度お試しください。', nosec: 'このブラウザでは保護されたエリアを開けません。最新のブラウザでHTTPS接続をご利用ください。', lock: 'ロック', deck: 'プレゼンテーション', close: '閉じる', back: 'ショーケース', code: 'アクセスコード', conf: '社外秘。転送はご遠慮ください。' },
    de: { area: 'Partnerbereich', intro: 'Geben Sie den Zugangscode ein, den Sie von Sensor Technology erhalten haben.', ph: 'ST-XXXX-XXXX-XXXX', go: 'Öffnen', busy: 'Code wird geprüft', bad: 'Dieser Code öffnet den Bereich nicht. Bitte prüfen und erneut versuchen.', nosec: 'Dieser Browser kann den geschützten Bereich nicht öffnen. Bitte einen aktuellen Browser über HTTPS verwenden.', lock: 'Sperren', deck: 'Präsentation', close: 'Schließen', back: 'Showcase', code: 'Zugangscode', conf: 'Vertraulich. Bitte nicht weiterleiten.' },
  };
  const svg = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const IC = { lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'), x: svg('<path d="M6 6l12 12M18 6 6 18"/>'), back: svg('<path d="M4 12h16M10 6l-6 6 6 6"/>') };
  const VAULT = JSON.parse(document.getElementById('vault').textContent);

  const store = { ok: true,
    get() { try { const o = JSON.parse(sessionStorage.getItem('st-pv') || 'null'); return o && o.c && Date.now() - o.t < 8 * 3600e3 ? o.c : null; } catch (e) { this.ok = false; return null; } },
    set(c) { try { sessionStorage.setItem('st-pv', JSON.stringify({ c, t: Date.now() })); } catch (e) { this.ok = false; } },

  let pcode = null;
  async function open(code) {

    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: b64(VAULT.salt), iterations: VAULT.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(VAULT.iv) }, key, b64(VAULT.ct));
    return new TextDecoder().decode(plain);
  }

  const root = document.getElementById('pa');
  const top = H('header', 'pa-top', root);
  const logo = H('img', '', top); logo.src = 'logo.png'; logo.alt = 'Sensor Technology';
  const name = H('span', 'name', top); H('span', 'sp', top);
  const langs = H('div', 'langs', top); const LBL = { en: 'EN', pt: 'PT', ja: '日本語', de: 'DE' };
  LANGS.forEach((l) => { const b = H('button', '', langs, LBL[l]); b.type = 'button'; b.dataset.l = l; b.addEventListener('click', () => setLang(l)); });
  const bLock = H('button', 'x', top); bLock.type = 'button'; bLock.hidden = true; bLock.addEventListener('click', lockNow);
  const deckUrl = () => 'planning.html' + `?lang=${lang}${EMBED ? '&embed=1' : ''}`;
  const aDeck = H('a', 'x', top); aDeck.href = deckUrl() + '#partners';
  // sem armazenamento de sessão, o código segue no fragmento do endereço (nunca no href)
  aDeck.addEventListener('click', (e) => { if (mod && pcode && !store.ok) { e.preventDefault(); location.href = deckUrl() + '#k=' + encodeURIComponent(pcode) + '&partners'; } });
  const xb = H(EMBED ? 'button' : 'a', 'x', top);
  if (EMBED) { xb.type = 'button'; xb.addEventListener('click', () => { try { parent.postMessage({ type: 'ops-close' }, location.origin); } catch (e) {} }); } else xb.href = './';
  const body = H('div', 'pa-body', root);
  // portão
  const gate = H('form', 'pa-gate', body); gate.setAttribute('autocomplete', 'off');
  const gIcon = H('div', 'g-ic', gate); gIcon.innerHTML = IC.lock;
  const gT = H('h1', '', gate), gP = H('p', '', gate);
  const gL = H('label', '', gate); const gLt = H('span', '', gL);
  const inp = H('input', '', gL); inp.type = 'text'; inp.name = 'partner-code'; inp.autocomplete = 'off'; inp.autocapitalize = 'characters'; inp.spellcheck = false; inp.inputMode = 'text'; inp.maxLength = 24;
  const gB = H('button', 'btn primary', gate); gB.type = 'submit';
  const gM = H('p', 'g-msg', gate); gM.setAttribute('role', 'alert');
  // conteúdo
  const wrap = H('div', 'pa-wrap', body); wrap.hidden = true;
  const side = H('aside', 'pa-side', wrap), navT = H('h2', '', side), nav = H('nav', '', side), conf = H('p', 'pa-conf', side);
  const main = H('main', 'pa-main', wrap);
  let mod = null, io = null;

  inp.addEventListener('input', () => { const raw = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 14); const parts = [raw.slice(0, 2), raw.slice(2, 6), raw.slice(6, 10), raw.slice(10, 14)].filter(Boolean); inp.value = parts.join('-'); gM.textContent = ''; });
  gate.addEventListener('submit', (e) => { e.preventDefault(); tryOpen(inp.value); });
  async function tryOpen(code, quiet) {
    const L = T[lang];
    if (!window.crypto || !crypto.subtle) { gM.textContent = L.nosec; return; }
    if (String(code).replace(/[^A-Za-z0-9]/g, '').length < 6) { gM.textContent = L.bad; return; }
    gB.disabled = true; gM.textContent = L.busy; gate.classList.add('busy');
    try {
      const src = await open(code);
      try { mod = new Function('Viz', src)(Viz); } catch (e2) { console.error('conteúdo de parceiros:', e2); throw e2; }
      pcode = String(code).toUpperCase().replace(/[^A-Z0-9]/g, ''); store.set(pcode);
      inp.value = ''; gM.textContent = ''; show();
    } catch (err) { if (quiet) { store.clear(); gM.textContent = ''; } else { gM.textContent = L.bad; inp.focus(); inp.select(); } }
    gB.disabled = false; gate.classList.remove('busy');
  }
  function show() {
    gate.hidden = true; wrap.hidden = false; bLock.hidden = false; paint();
  }
  function paint() {
    if (!mod) return; const L = T[lang];
    main.scrollTop = 0; mod.render(lang, main);
    nav.textContent = ''; const titles = mod.sections(lang);
    titles.forEach((t, i) => { const b = H('button', '', nav, t); b.type = 'button'; b.addEventListener('click', () => { const s = document.getElementById('pa-' + (i + 1)); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); }); });
    navT.textContent = L.area; conf.textContent = L.conf;
    if (io) io.disconnect();
    if (window.IntersectionObserver) { io = new IntersectionObserver((es) => { es.forEach((en) => { if (en.isIntersecting) { const n = +en.target.id.slice(3) - 1; Array.from(nav.children).forEach((b, k) => b.classList.toggle('on', k === n)); } }); }, { root: getComputedStyle(main).overflowY === 'visible' ? null : main, rootMargin: '-15% 0px -70% 0px' });
      main.querySelectorAll('.pa-sec').forEach((s) => io.observe(s)); }
  }
  function lockNow() { mod = null; pcode = null; store.clear(); main.textContent = ''; nav.textContent = ''; wrap.hidden = true; gate.hidden = false; bLock.hidden = true; Viz.hideTip(); texts(); setTimeout(() => inp.focus(), 50); }
  function texts() {
    const L = T[lang]; document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang; document.title = 'Sensor Technology · ' + L.area;
    name.textContent = L.area; gT.textContent = L.area; gP.textContent = L.intro; gLt.textContent = L.code; inp.placeholder = L.ph; gB.textContent = L.go;
    Array.from(langs.children).forEach((b) => b.classList.toggle('on', b.dataset.l === lang));
    bLock.innerHTML = IC.lock; H('span', '', bLock, L.lock);
    aDeck.innerHTML = IC.back; H('span', '', aDeck, L.deck); aDeck.href = deckUrl() + '#partners';
    xb.innerHTML = EMBED ? IC.x : IC.back; H('span', '', xb, EMBED ? L.close : L.back); if (!EMBED) xb.hidden = true;
  }
  function setLang(l) { if (l === lang) return; lang = l; try { localStorage.setItem('ops-lang', l); } catch (e) {} texts(); gM.textContent = ''; if (mod) paint(); }
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && EMBED) { try { parent.postMessage({ type: 'ops-close' }, location.origin); } catch (err) {} } });

  texts();
  const hk = /[#&]k=([^&]+)/.exec(location.hash);
  const saved = hk ? null : store.get();

  else if (saved) tryOpen(saved, true);
  else setTimeout(() => { try { inp.focus(); } catch (e) {} }, 300);
  window.ST_PARTNERS = { tryOpen, lock: lockNow, setLang, get open() { return !!mod; } };
})();
